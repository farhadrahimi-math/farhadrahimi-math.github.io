<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون</title>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#f4f6fb;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 15px 30px rgba(0,0,0,0.1);
}

.timer{
  text-align:left;
  font-weight:bold;
  color:#d00000;
}

img{
  max-width:100%;
  border-radius:10px;
  margin:15px 0;
}

.options button{
  display:block;
  width:100%;
  margin:8px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#74c69d;
  color:white;
  cursor:pointer;
}

.options button:hover{
  background:#52b788;
}

#result{
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h2>📊 آزمون</h2>

<div class="timer">
زمان باقی‌مانده: <span id="time">05:00</span>
</div>

<div id="examContent"></div>

<div id="result"></div>

</div>

<script>

const supabaseUrl = "https://ypjmkigvghybkwyxndcz.supabase.co";
const supabaseKey = "YOUR_ANON_KEY";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const params = new URLSearchParams(window.location.search);
const grade = parseInt(params.get("grade"));
const chapter = parseInt(params.get("chapter"));
const examNumber = parseInt(params.get("exam"));
const level = parseInt(params.get("level"));

let questions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let userAnswers = [];
let timeLeft = 300;
let timerInterval;
let sessionUser;

async function checkAccess(){

  const { data:{session} } = await supabaseClient.auth.getSession();
  if(!session){
    window.location.href="index.html";
    return;
  }

  sessionUser = session.user;

  // جلوگیری از شرکت دوباره در صورت قبولی
  const { data } = await supabaseClient
    .from("exam_results")
    .select("*")
    .eq("user_id", sessionUser.id)
    .eq("grade", grade)
    .eq("chapter", chapter)
    .eq("level", level)
    .gte("score", 15);

  if(data.length > 0){
    document.getElementById("examContent").innerHTML =
      "✅ شما قبلاً این سطح را با موفقیت گذرانده‌اید.";
    return;
  }

  loadExam();
}

async function loadExam(){

  const { data } = await supabaseClient
    .from("exam_questions")
    .select("*")
    .eq("grade", grade)
    .eq("chapter", chapter)
    .eq("exam_number", examNumber)
    .eq("level", level);

  questions = data.sort(() => 0.5 - Math.random());

  loadQuestion();
  startTimer();
}

function startTimer(){
  timerInterval = setInterval(()=>{
    timeLeft--;
    let m = Math.floor(timeLeft/60);
    let s = timeLeft%60;

    document.getElementById("time").innerText =
      (m<10?"0":"")+m+":"+(s<10?"0":"")+s;

    if(timeLeft<=0){
      clearInterval(timerInterval);
      finishExam();
    }
  },1000);
}

function loadQuestion(){

  if(currentIndex >= questions.length){
    finishExam();
    return;
  }

  const q = questions[currentIndex];

  document.getElementById("examContent").innerHTML = `
    <p>سوال ${currentIndex+1} از ${questions.length}</p>
    <img src="${q.image_url}">
    <div class="options">
      <button onclick="answer(1)">${q.option1}</button>
      <button onclick="answer(2)">${q.option2}</button>
      <button onclick="answer(3)">${q.option3}</button>
      <button onclick="answer(4)">${q.option4}</button>
    </div>
  `;
}

function answer(choice){

  const correct = questions[currentIndex].correct_option;

  userAnswers.push({
    question_id: questions[currentIndex].id,
    selected: choice,
    correct: correct
  });

  if(choice === correct){
    correctCount++;
  }else{
    wrongCount++;
  }

  currentIndex++;
  loadQuestion();
}

async function finishExam(){

  clearInterval(timerInterval);

  const score = correctCount * 2;
  const percent = ((correctCount / questions.length) * 100).toFixed(1);

  let resultHtml = `
    ✅ آزمون تمام شد<br>
    صحیح: ${correctCount}<br>
    غلط: ${wrongCount}<br>
    نمره: ${score} از 20<br>
    درصد: ${percent}٪<br><br>
  `;

  if(score >= 15){
    resultHtml += "🎉 قبولی! سطح بعدی برای شما فعال شد.<br><br>";
  }else{
    resultHtml += "🔁 مردود شدید. برای ارتقا باید حداقل 15 بگیرید.<br><br>";
  }

  resultHtml += "<hr><h3>📋 بررسی پاسخ‌ها</h3>";

  // ✅ نمایش تحلیل هر سوال
  userAnswers.forEach((ans, index)=>{

    const q = questions.find(q => q.id === ans.question_id);

    resultHtml += `
      <div style="margin:15px 0; padding:10px; border:1px solid #ddd; border-radius:10px;">
        <b>سوال ${index+1}</b><br>
        <img src="${q.image_url}" style="max-width:100%; border-radius:8px;"><br><br>
        پاسخ شما: ${q["option"+ans.selected]}<br>
        پاسخ صحیح: ${q["option"+ans.correct]}<br>
        ${ans.selected === ans.correct 
          ? "<span style='color:green;'>✅ درست</span>" 
          : "<span style='color:red;'>❌ نادرست</span>"
        }
      </div>
    `;
  });

  document.getElementById("examContent").innerHTML = "";
  document.getElementById("result").innerHTML = resultHtml;

  // ✅ ذخیره نتیجه
  await supabaseClient
    .from("exam_results")
    .insert([{
      user_id: sessionUser.id,
      grade: grade,
      chapter: chapter,
      exam_number: examNumber,
      level: level,
      score: score,
      total_questions: questions.length,
      answers: userAnswers
    }]);
}

checkAccess();
</script>

</body>
</html>
