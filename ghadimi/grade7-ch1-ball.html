<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>🎮 بازی حرکت توپ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 15px;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,.2);
            text-align: center;
        }

        h1 {
            margin-top: 5px;
            font-size: 25px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .badge {
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
        }

        #scoreBox {
            color: #2563eb;
        }

        #question {
            background: #eff6ff;
            padding: 15px;
            border-radius: 14px;
            line-height: 2;
            font-size: 17px;
            margin-bottom: 15px;
        }

        .answer-area {
            margin: 15px 0;
        }

        input {
            width: 160px;
            max-width: 100%;
            padding: 11px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            text-align: center;
            font-size: 17px;
        }

        button {
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            font-size: 15px;
            cursor: pointer;
            margin: 4px;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .secondary {
            background: #64748b;
        }

        .scene {
            position: relative;
            height: 390px;
            margin: 20px 0;
            border-radius: 15px;
            overflow-x: auto;
            overflow-y: hidden;
            background:
                linear-gradient(
                    to top,
                    #2ecc71 20%,
                    #87ceeb 20%
                );
        }

        .ground {
            position: absolute;
            bottom: 20%;
            width: 100%;
            height: 4px;
            background: #334155;
        }

        .ball {
            position: absolute;
            left: 35px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow:
                inset -7px -7px 12px rgba(0,0,0,.25),
                inset 7px 7px 12px rgba(255,255,255,.3);
        }

        .arrow {
            position: absolute;
            width: 7px;
            border-radius: 5px;
        }

        .arrow.up {
            background: #059669;
        }

        .arrow.down {
            background: #dc2626;
        }

        .arrow::after {
            content: "";
            position: absolute;
            left: -7px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
        }

        .arrow.up::after {
            top: -12px;
            border-bottom: 15px solid #059669;
        }

        .arrow.down::after {
            bottom: -12px;
            border-top: 15px solid #dc2626;
        }

        .label {
            position: absolute;
            font-weight: bold;
            font-size: 13px;
        }

        #formula {
            min-height: 30px;
            direction: ltr;
            font-weight: bold;
            font-size: 18px;
        }

        #message {
            min-height: 35px;
            margin: 12px 0;
            font-weight: bold;
            font-size: 16px;
        }

        .game-over {
            display: none;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 16px;
            margin-top: 20px;
        }

        .final-score {
            font-size: 35px;
            color: #2563eb;
            font-weight: bold;
            margin: 10px;
        }

        #leaderboard {
            margin-top: 25px;
            padding: 18px;
            background: #f8fafc;
            border-radius: 16px;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            padding: 11px 13px;
            background: white;
            margin: 7px 0;
            border-radius: 10px;
        }

        .leaderboard-score {
            color: #2563eb;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        @media(max-width:600px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 13px;
            }

            .scene {
                height: 340px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎮 بازی حرکت توپ</h1>

    <div class="top-bar">

        <div class="badge" id="playerBox">
            بازیکن: ...
        </div>

        <div class="badge" id="questionCounter">
            سؤال 1 از 10
        </div>

        <div class="badge" id="scoreBox">
            امتیاز: 0
        </div>

    </div>


    <div id="gameContent">

        <div id="question"></div>

        <div class="answer-area">
            <input
                id="userAnswer"
                type="number"
                inputmode="decimal"
                placeholder="پاسخ">
        </div>

        <div>

            <button
                id="stepBtn"
                type="button">
                نمایش حرکت
            </button>

            <button
                id="checkBtn"
                type="button">
                بررسی پاسخ
            </button>

        </div>


        <div class="scene" id="scene">

            <div class="ground"></div>

            <div class="ball" id="ball"></div>

        </div>

        <div id="formula"></div>

        <div id="message"></div>

        <button
            id="nextBtn"
            type="button"
            style="display:none;">
            سؤال بعدی
        </button>

    </div>


    <div class="game-over" id="gameOver">

        <h2>🏁 بازی تمام شد</h2>

        <p id="finalPlayer"></p>

        <div class="final-score" id="finalScore">
            0
        </div>

        <p>از 100 امتیاز</p>

        <button
            id="restartBtn"
            type="button">
            بازی دوباره
        </button>

    </div>


    <div id="leaderboard">

        <h2>🏆 برترین‌های بازی توپ</h2>

        <div id="leaderboardList">
            در حال دریافت...
        </div>

    </div>


    <a
        class="back-link"
        href="/#game">
        ← بازگشت به بازی‌های ریاضی
    </a>

</div>


<script src="/games/game-sdk.js"></script>

<script>

const GAME_ID = 1;
const TOTAL_QUESTIONS = 10;

const player = GameSDK.init(GAME_ID);

document.getElementById("playerBox").textContent =
    `بازیکن: ${player.playerName}`;

let questionNumber = 1;
let score = 0;

let initialHeight = 0;
let currentHeight = 0;
let bounceTarget = 0;
let bounceCount = 0;
let totalDistance = 0;

let distances = [];
let arrowOffset = 130;

let answerChecked = false;
let animationRunning = false;

const ball =
    document.getElementById("ball");

const scene =
    document.getElementById("scene");


function generateQuestion() {

    bounceTarget =
        Math.floor(Math.random() * 4) + 2;

    const power =
        Math.pow(2, bounceTarget);

    const multiplier =
        Math.floor(Math.random() * 3) + 2;

    initialHeight =
        power * multiplier;

    currentHeight =
        initialHeight;

    bounceCount = 0;
    totalDistance = 0;

    distances = [];
    arrowOffset = 130;

    answerChecked = false;
    animationRunning = false;

    document.getElementById("questionCounter")
        .textContent =
        `سؤال ${questionNumber} از ${TOTAL_QUESTIONS}`;

    document.getElementById("question")
        .innerHTML =
        `توپ از ارتفاع <b>${initialHeight}</b> متر رها می‌شود.
        هر بار نصف ارتفاع قبلی بالا می‌آید.
        تا برخورد شماره <b>${bounceTarget}</b>
        چند متر حرکت می‌کند؟`;

    document.getElementById("userAnswer").value = "";

    document.getElementById("message").textContent = "";

    document.getElementById("formula").textContent = "";

    document.getElementById("nextBtn").style.display = "none";

    document.getElementById("checkBtn").disabled = false;

    document.getElementById("stepBtn").disabled = false;

    document
        .querySelectorAll(".arrow,.label")
        .forEach(el => el.remove());

    updateBallPosition(initialHeight);
}


function getGroundY() {

    const ground =
        document.querySelector(".ground");

    const sceneRect =
        scene.getBoundingClientRect();

    const groundRect =
        ground.getBoundingClientRect();

    return sceneRect.bottom -
        groundRect.top;
}


function meterToPixel(meter) {

    const usableHeight =
        Math.max(
            150,
            scene.clientHeight * 0.65
        );

    return getGroundY() +
        (meter / initialHeight) *
        usableHeight;
}


function updateBallPosition(height) {

    const bottom =
        meterToPixel(height) - 52;

    ball.style.bottom =
        `${Math.max(0, bottom)}px`;
}


function animateMove(
    from,
    to,
    duration,
    callback
) {

    animationRunning = true;

    let start = null;

    function step(timestamp) {

        if (!start) {
            start = timestamp;
        }

        const progress =
            Math.min(
                (timestamp - start) / duration,
                1
            );

        const height =
            from +
            (to - from) * progress;

        updateBallPosition(height);

        if (progress < 1) {

            requestAnimationFrame(step);

        } else {

            animationRunning = false;

            callback?.();
        }
    }

    requestAnimationFrame(step);
}


function drawArrow(from, to, direction) {

    const start =
        meterToPixel(from);

    const end =
        meterToPixel(to);

    const length =
        Math.abs(start - end);

    const arrow =
        document.createElement("div");

    arrow.className =
        `arrow ${direction}`;

    arrow.style.height =
        `${length}px`;

    arrow.style.left =
        `${arrowOffset}px`;

    arrow.style.bottom =
        `${Math.min(start, end)}px`;

    const label =
        document.createElement("div");

    label.className = "label";

    label.style.left =
        `${arrowOffset - 10}px`;

    label.style.bottom =
        `${Math.max(start, end) + 5}px`;

    label.textContent =
        Math.abs(from - to);

    label.style.color =
        direction === "up"
            ? "#059669"
            : "#dc2626";

    scene.appendChild(arrow);
    scene.appendChild(label);

    arrowOffset += 55;
}


function updateFormula() {

    if (!distances.length) {
        return;
    }

    document.getElementById("formula")
        .textContent =
        distances.join(" + ") +
        " = " +
        distances.reduce(
            (sum, value) =>
                sum + value,
            0
        );
}


function nextStep() {

    if (animationRunning) {
        return;
    }

    if (bounceCount === 0) {

        totalDistance += currentHeight;

        distances.push(currentHeight);

        updateFormula();

        drawArrow(
            currentHeight,
            0,
            "down"
        );

        animateMove(
            currentHeight,
            0,
            500,
            () => {
                bounceCount++;
            }
        );

        return;
    }


    if (bounceCount < bounceTarget) {

        currentHeight =
            currentHeight / 2;

        totalDistance +=
            currentHeight * 2;

        distances.push(
            currentHeight,
            currentHeight
        );

        updateFormula();

        drawArrow(
            0,
            currentHeight,
            "up"
        );

        animateMove(
            0,
            currentHeight,
            400,
            () => {

                drawArrow(
                    currentHeight,
                    0,
                    "down"
                );

                animateMove(
                    currentHeight,
                    0,
                    400,
                    () => {
                        bounceCount++;
                    }
                );
            }
        );

        return;
    }


    document.getElementById("message")
        .textContent =
        "✅ حرکت کامل نمایش داده شد.";
}


function checkAnswer() {

    if (answerChecked) {
        return;
    }

    const input =
        document.getElementById("userAnswer");

    if (input.value.trim() === "") {

        document.getElementById("message")
            .textContent =
            "لطفاً پاسخ را وارد کنید.";

        return;
    }

    const answer =
        Number(input.value);

    /*
     * پاسخ صحیح را مستقل از انیمیشن
     * محاسبه می‌کنیم.
     */
    let correctAnswer =
        initialHeight;

    let height =
        initialHeight;

    for (
        let i = 1;
        i < bounceTarget;
        i++
    ) {

        height /= 2;

        correctAnswer +=
            height * 2;
    }


    answerChecked = true;

    document.getElementById("checkBtn")
        .disabled = true;


    if (answer === correctAnswer) {

        score += 10;

        document.getElementById("message")
            .textContent =
            "✅ آفرین! پاسخ درست بود. +10";

    } else {

        document.getElementById("message")
            .textContent =
            `❌ پاسخ درست: ${correctAnswer}`;
    }


    document.getElementById("scoreBox")
        .textContent =
        `امتیاز: ${score}`;


    const next =
        document.getElementById("nextBtn");

    next.style.display = "inline-block";

    next.textContent =
        questionNumber === TOTAL_QUESTIONS
            ? "مشاهده نتیجه"
            : "سؤال بعدی";
}


async function nextQuestion() {

    if (!answerChecked) {
        return;
    }


    if (
        questionNumber >=
        TOTAL_QUESTIONS
    ) {

        await finishGame();

        return;
    }


    questionNumber++;

    generateQuestion();
}


async function finishGame() {

    document.getElementById("gameContent")
        .style.display = "none";

    document.getElementById("gameOver")
        .style.display = "block";


    document.getElementById("finalPlayer")
        .textContent =
        `${player.playerName}، امتیاز نهایی شما:`;


    document.getElementById("finalScore")
        .textContent =
        score;


    const result =
        await GameSDK.finishGame(score);


    if (!result?.success) {

        document.getElementById("finalPlayer")
            .textContent =
            `${player.playerName} — خطا در ثبت امتیاز`;
    }


    await showLeaderboard();
}


async function showLeaderboard() {

    const scores =
        await GameSDK.getLeaderboard(10);

    const list =
        document.getElementById(
            "leaderboardList"
        );


    if (!scores.length) {

        list.textContent =
            "هنوز امتیازی ثبت نشده است.";

        return;
    }


    list.innerHTML =
        scores.map(
            (item, index) => {

                let rank =
                    `${index + 1}.`;

                if (index === 0)
                    rank = "🥇";

                if (index === 1)
                    rank = "🥈";

                if (index === 2)
                    rank = "🥉";


                return `

                    <div class="leaderboard-row">

                        <span>
                            ${rank}
                            ${escapeHtml(
                                item.player_name
                            )}
                        </span>

                        <span class="leaderboard-score">
                            ${item.score}
                        </span>

                    </div>

                `;
            }
        ).join("");
}


function restartGame() {

    questionNumber = 1;
    score = 0;

    GameSDK.reset();

    document.getElementById("scoreBox")
        .textContent =
        "امتیاز: 0";

    document.getElementById("gameOver")
        .style.display = "none";

    document.getElementById("gameContent")
        .style.display = "block";

    generateQuestion();
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


document.getElementById("stepBtn")
    .addEventListener(
        "click",
        nextStep
    );


document.getElementById("checkBtn")
    .addEventListener(
        "click",
        checkAnswer
    );


document.getElementById("nextBtn")
    .addEventListener(
        "click",
        nextQuestion
    );


document.getElementById("restartBtn")
    .addEventListener(
        "click",
        restartGame
    );


generateQuestion();

showLeaderboard();

</script>

</body>
</html>
