<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت</title>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#f4f6fb;
  padding:30px;
}

.container{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 30px rgba(0,0,0,0.1);
}

h2{margin-top:0;}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-bottom:30px;
}

.stat-card{
  background:linear-gradient(135deg,#74c69d,#2d6a4f);
  color:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  font-size:16px;
  font-weight:bold;
}

input, select{
  padding:8px;
  margin:5px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:8px 16px;
  border:none;
  border-radius:8px;
  background:#2d6a4f;
  color:white;
  cursor:pointer;
  margin:5px;
}

.edit-btn{ background:#667eea; }
.delete-btn{ background:#e76f51; }

table{
  width:100%;
  margin-top:15px;
  border-collapse:collapse;
}

th, td{
  padding:8px;
  border-bottom:1px solid #eee;
  text-align:center;
}
</style>
</head>
<body>

<div class="container">

<h2>👑 پنل مدیریت</h2>

<!-- ✅ داشبورد آماری -->
<div class="stats">
  <div class="stat-card" id="totalStudents">کل دانش‌آموزان: 0</div>
  <div class="stat-card" id="grade7Count">پایه ۷: 0</div>
  <div class="stat-card" id="grade8Count">پایه ۸: 0</div>
  <div class="stat-card" id="grade9Count">پایه ۹: 0</div>
</div>

<hr>

<h3>➕ افزودن دانش‌آموز</h3>

<input type="text" id="name" placeholder="نام">
<input type="text" id="phone" placeholder="شماره تلفن">
<input type="password" id="password" placeholder="رمز عبور">

<select id="grade">
  <option value="7">پایه ۷</option>
  <option value="8">پایه ۸</option>
  <option value="9">پایه ۹</option>
</select>

<button onclick="addStudent()">ثبت دانش‌آموز</button>

<h3>📋 لیست دانش‌آموزان</h3>

<table>
<thead>
<tr>
<th>نام</th>
<th>پایه</th>
<th>وضعیت</th>
<th>فعال/غیرفعال</th>
</tr>
</thead>
<tbody id="studentsTable"></tbody>
</table>

<hr>

<h3>📊 افزودن سوال آزمون</h3>

<select id="examGrade">
  <option value="7">پایه ۷</option>
  <option value="8">پایه ۸</option>
  <option value="9">پایه ۹</option>
</select>

<input type="number" id="examChapter" placeholder="شماره فصل">
<input type="number" id="examNumber" placeholder="شماره آزمون">

<br><br>

<input type="file" id="questionImage" accept="image/*">

<br><br>

<input type="text" id="option1" placeholder="گزینه ۱">
<input type="text" id="option2" placeholder="گزینه ۲">
<input type="text" id="option3" placeholder="گزینه ۳">
<input type="text" id="option4" placeholder="گزینه ۴">

<select id="correctOption">
  <option value="1">گزینه صحیح: ۱</option>
  <option value="2">گزینه صحیح: ۲</option>
  <option value="3">گزینه صحیح: ۳</option>
  <option value="4">گزینه صحیح: ۴</option>
</select>

<button onclick="addExamQuestion()">ثبت سوال</button>

<h3>📋 لیست سوال‌های آزمون</h3>

<table>
<thead>
<tr>
<th>ID</th>
<th>پایه</th>
<th>فصل</th>
<th>آزمون</th>
<th>ویرایش</th>
<th>حذف</th>
</tr>
</thead>
<tbody id="examQuestionsTable"></tbody>
</table>

</div>

<script>

const supabaseUrl = "https://ypjmkigvghybkwyxndcz.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlwam1raWd2Z2h5Ymt3eXhuZGN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMTc1NTgsImV4cCI6MjA5OTY5MzU1OH0.lJ5RddKmDdPfLecBsqL9XMGejL9Owbv1ZH2PXSqqdv4";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function checkAdmin(){

  const { data:{session} } = await supabaseClient.auth.getSession();

  if(!session){
    window.location.href="index.html";
    return;
  }

  const { data: profile } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", session.user.id)
    .single();

  if(!profile || profile.role !== "admin"){
    window.location.href="index.html";
  }
}

async function loadStudents(){

  const { data } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("role","student");

  document.getElementById("totalStudents").innerText =
    "کل دانش‌آموزان: " + data.length;

  document.getElementById("grade7Count").innerText =
    "پایه ۷: " + data.filter(s=>s.grade==7).length;

  document.getElementById("grade8Count").innerText =
    "پایه ۸: " + data.filter(s=>s.grade==8).length;

  document.getElementById("grade9Count").innerText =
    "پایه ۹: " + data.filter(s=>s.grade==9).length;

  const table = document.getElementById("studentsTable");
  table.innerHTML="";

  data.forEach(s=>{
    table.innerHTML += `
      <tr>
        <td>${s.name}</td>
        <td>${s.grade}</td>
        <td>${s.is_active ? "✅ فعال" : "❌ غیرفعال"}</td>
        <td>
          <button onclick="toggleStudent('${s.id}', ${s.is_active})">
            ${s.is_active ? "غیرفعال" : "فعال"}
          </button>
        </td>
      </tr>
    `;
  });
}

async function toggleStudent(id, currentStatus){

  await supabaseClient
    .from("profiles")
    .update({ is_active: !currentStatus })
    .eq("id", id);

  loadStudents();
}

async function addStudent(){

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const password = document.getElementById("password").value;
  const grade = document.getElementById("grade").value;

  const email = phone + "@school.local";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if(error){
    alert(error.message);
    return;
  }

  await supabaseClient.from("profiles").insert([
    {
      id: data.user.id,
      name: name,
      grade: parseInt(grade),
      is_active: true,
      role: "student"
    }
  ]);

  loadStudents();
}

async function addExamQuestion(){

  const file = document.getElementById("questionImage").files[0];
  if(!file){ alert("تصویر را انتخاب کنید"); return; }

  const fileName = Date.now()+"_"+file.name;

  await supabaseClient.storage
    .from("exam-questions")
    .upload(fileName, file);

  const { data } = supabaseClient.storage
    .from("exam-questions")
    .getPublicUrl(fileName);

  await supabaseClient.from("exam_questions").insert([{
    grade: parseInt(document.getElementById("examGrade").value),
    chapter: parseInt(document.getElementById("examChapter").value),
    exam_number: parseInt(document.getElementById("examNumber").value),
    image_url: data.publicUrl,
    option1: document.getElementById("option1").value,
    option2: document.getElementById("option2").value,
    option3: document.getElementById("option3").value,
    option4: document.getElementById("option4").value,
    correct_option: parseInt(document.getElementById("correctOption").value)
  }]);

  loadExamQuestions();
}

async function loadExamQuestions(){

  const { data } = await supabaseClient
    .from("exam_questions")
    .select("*");

  const table = document.getElementById("examQuestionsTable");
  table.innerHTML="";

  data.forEach(q=>{
    table.innerHTML += `
      <tr>
        <td>${q.id}</td>
        <td>${q.grade}</td>
        <td>${q.chapter}</td>
        <td>${q.exam_number}</td>
        <td>
          <button onclick="editQuestion(${q.id})" class="edit-btn">ویرایش</button>
        </td>
        <td>
          <button onclick="deleteQuestion(${q.id})" class="delete-btn">حذف</button>
        </td>
      </tr>
    `;
  });
}

async function deleteQuestion(id){
  await supabaseClient.from("exam_questions").delete().eq("id",id);
  loadExamQuestions();
}

function editQuestion(id){
  alert("نسخه ساده فعال است. بعداً مودال حرفه‌ای می‌سازیم ✅");
}

checkAdmin();
loadStudents();
loadExamQuestions();

</script>

</body>
</html>
