<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نینجای میان‌بُر 🥷⚡ | ریاضی هشتم</title>
<style>
:root{
 --purple:#7456d8;--blue:#3e83ed;--pink:#ec70a7;--yellow:#f5c543;
 --green:#29ad78;--red:#e65362;--ink:#29334b;--muted:#6d7690;
 --dark:#252b40;--shadow:0 10px 28px rgba(58,51,108,.12)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
 font-family:Tahoma,Arial,sans-serif;color:var(--ink);line-height:1.65;
 background:
 radial-gradient(circle at 10% 4%,#e7e2ff 0,transparent 27%),
 radial-gradient(circle at 92% 14%,#dcf4ff 0,transparent 25%),
 #f7f7fc
}
button{font:inherit}
button:focus-visible{outline:3px solid #267ee8;outline-offset:3px}
.app{width:min(100%,920px);margin:auto;padding:14px 12px 30px}
.header{
 background:linear-gradient(135deg,#7353d6,#4086eb);color:#fff;
 border-radius:22px;padding:16px;box-shadow:var(--shadow)
}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{
 padding:3px 9px;border-radius:99px;font-size:11px;font-weight:bold;
 background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.26)
}
h1{font-size:clamp(23px,6vw,34px);margin:8px 0 2px}
.subtitle{margin:0;color:#f2efff;font-size:13px}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.status-card{min-width:0;background:#fff;color:var(--ink);border-radius:13px;padding:6px 3px;text-align:center}
.status-card small{display:block;color:var(--muted);font-size:10px}
.status-card strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-box{margin-top:9px;padding:7px;border-radius:13px;background:rgba(255,255,255,.15)}
.timer-head{display:flex;justify-content:space-between;font-size:12px}
.timer-track{height:9px;margin-top:5px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.timer-fill{height:100%;width:100%;background:#51dd91;border-radius:inherit;transition:width .15s linear,background .2s}

.game-card{margin-top:13px;background:#fff;border-radius:22px;padding:15px;min-height:490px;box-shadow:var(--shadow)}
.topline{display:flex;justify-content:space-between;gap:8px;align-items:center}
.level{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:bold;background:#e9f8ef;color:#18794d}
.level.master{background:#fff3ca;color:#916600}.level.challenge{background:#ffe9ee;color:#bc3850}
.prompt{text-align:center;font-weight:bold;font-size:clamp(16px,4.5vw,20px);margin:15px auto 4px}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-bottom:11px}

.dojo{
 max-width:740px;margin:auto;border-radius:20px;padding:15px 10px;
 background:linear-gradient(145deg,#282d43,#343957);
 color:white;position:relative;overflow:hidden
}
.dojo::after{
 content:"🥷";position:absolute;left:-5px;bottom:-24px;
 font-size:105px;opacity:.045;pointer-events:none
}
.dojo-head{text-align:center;color:#cbd3eb;font-size:12px}
.expression{
 direction:ltr;unicode-bidi:isolate;display:flex;justify-content:center;
 align-items:center;flex-wrap:wrap;gap:6px;min-height:95px;padding:12px 4px
}
.term{
 min-width:55px;min-height:49px;border:2px solid #626c8a;
 background:#3d4565;color:#fff;border-radius:13px;
 padding:6px 10px;font-weight:bold;font-size:17px;cursor:pointer
}
.term.selected{border-color:#f5c543;box-shadow:0 0 0 3px rgba(245,197,67,.25);transform:translateY(-2px)}
.term.cleared{opacity:.25;text-decoration:line-through}
.term.key{border-color:#4fc185;background:#324e49}
.operator{color:#cbd5ed;font-size:18px;font-weight:bold}
.factor{
 min-width:68px;min-height:52px;border:2px solid #626c8a;
 background:#3d4565;color:#fff;border-radius:13px;padding:6px 9px;
 font-weight:bold;cursor:pointer
}
.factor.selected{border-color:#f5c543;box-shadow:0 0 0 3px rgba(245,197,67,.22)}
.factor.found{background:#294f43;border-color:#4fc185}

.mission-meter{
 max-width:600px;margin:4px auto 10px;background:#21263a;
 border-radius:13px;padding:9px 11px;text-align:center;
 color:#cbd3e9;font-size:12px
}
.mission-meter strong{color:#fff}
.discovery{
 min-height:38px;text-align:center;color:#d8dff1;
 font-size:13px;margin-top:8px
}

.sequence{
 direction:ltr;display:flex;justify-content:center;align-items:center;
 gap:6px;flex-wrap:wrap;padding:11px 3px
}
.seq-card{
 min-width:48px;min-height:45px;border:2px solid #626c8a;
 background:#3d4565;color:#fff;border-radius:12px;
 font-weight:bold;cursor:pointer
}
.seq-card.selected{border-color:#f5c543;background:#554e57}
.seq-card.paired{opacity:.28;text-decoration:line-through}
.pairs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:36px;margin-top:6px}
.pair-chip{background:#2d594a;border:1px solid #4db984;color:#e7fff3;border-radius:10px;padding:5px 8px;font-size:12px}

.action-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:14px;min-height:48px;padding:9px 18px;font-weight:bold;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#7556d7,#4283e9);color:#fff}
.btn-secondary{background:#edf0f6;color:#3e485e}
.btn:disabled{opacity:.45;cursor:not-allowed}

.feedback{display:none;margin-top:13px;padding:11px 13px;border-radius:14px;font-size:14px}
.feedback.show{display:block}
.feedback.good{background:#e8f8ef;border:1px solid #a8ddbf;color:#176b43}
.feedback.bad{background:#ffebee;border:1px solid #efb4bd;color:#a52b40}
.feedback.timeout{background:#fff3da;border:1px solid #e9ca84;color:#835c00}
.feedback strong{display:block}

.result{display:none;text-align:center}.result.show{display:block}
.score-circle{
 width:128px;height:128px;border-radius:50%;margin:17px auto;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#e7e1ff,#daf3ff);
 border:7px solid #fff;box-shadow:0 0 0 3px #7456d8
}
.score-circle strong{font-size:35px;color:#6544cf}.score-circle small{color:#667}
.leaderboard{max-width:530px;margin:18px auto;background:#f8f8fc;border-radius:16px;padding:10px;text-align:right}
.leader-row{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid #e2e2ec}
.leader-row:last-child{border-bottom:0}.error{text-align:center;color:#a72e43;font-size:12px}
.back{display:block;text-align:center;margin:17px auto;color:#604bbc;font-weight:bold;text-decoration:none}
.pop{animation:pop .28s ease}.shake{animation:shake .28s ease}
@keyframes pop{50%{transform:scale(1.025)}}@keyframes shake{25%{transform:translateX(4px)}50%{transform:translateX(-4px)}75%{transform:translateX(3px)}}
@media(min-width:650px){.app{padding:22px 18px 40px}.header{padding:20px}.game-card{padding:22px}}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<main class="app">
<header class="header">
 <div class="badges"><span class="badge">پایه هشتم</span><span class="badge">فصل ۱</span><span class="badge">درس ۱</span></div>
 <h1>نینجای میان‌بُر 🥷⚡</h1>
 <p class="subtitle">قبل از محاسبه، چیزی را پیدا کن که محاسبه را کوتاه می‌کند.</p>

 <div class="status">
  <div class="status-card"><small>بازیکن</small><strong id="playerName">...</strong></div>
  <div class="status-card"><small>مأموریت</small><strong id="missionStatus">۱ از ۱۰</strong></div>
  <div class="status-card"><small>امتیاز</small><strong id="scoreStatus">۰ از ۱۰۰</strong></div>
 </div>

 <div class="timer-box">
  <div class="timer-head"><span>⏱ زمان باقی‌مانده</span><strong id="timeText">۳۰ ثانیه</strong></div>
  <div class="timer-track"><div id="timerFill" class="timer-fill"></div></div>
 </div>
</header>

<section id="gameCard" class="game-card">
 <div id="playArea">
  <div class="topline">
   <span id="levelBadge" class="level">🟢 پایه</span>
   <span style="font-size:12px;color:#707890">کمتر حساب کن، بیشتر ببین ⚡</span>
  </div>

  <div id="prompt" class="prompt"></div>
  <div id="hint" class="hint"></div>

  <div class="dojo">
   <div class="dojo-head">میدان تمرین نینجا</div>
   <div id="workspace"></div>
   <div id="meter" class="mission-meter"></div>
   <div id="discovery" class="discovery"></div>
  </div>

  <div class="action-row">
   <button id="resetBtn" class="btn btn-secondary" type="button">↩ بازنشانی</button>
   <button id="checkBtn" class="btn btn-primary" type="button">ثبت میان‌بُر ⚡</button>
   <button id="nextBtn" class="btn btn-primary" type="button" hidden>مأموریت بعدی</button>
  </div>

  <div id="feedback" class="feedback" aria-live="polite"></div>
 </div>

 <div id="resultArea" class="result">
  <div style="font-size:48px">🥷🏆</div><h2>دوره نینجا کامل شد!</h2><p id="resultName"></p>
  <div class="score-circle"><strong id="finalScore">۰</strong><small>از ۱۰۰</small></div>
  <p id="resultMessage"></p>
  <button id="restartBtn" class="btn btn-primary" type="button">🔄 بازی دوباره</button>

  <div class="leaderboard">
   <h3 style="text-align:center;margin:5px">🏆 نینجاهای برتر</h3>
   <div id="leaderRows"></div>
  </div>
 </div>
</section>

<a class="back" href="/#game">← بازگشت به بازی‌های ریاضی</a>
</main>

<script src="/games/game-sdk.js"></script>
<script>
"use strict";

const GAME_ID = 20;
const player = GameSDK.init(GAME_ID);

const TOTAL_QUESTIONS = 10;
const QUESTION_TIME = 30;
const RECENT_KEY = "grade8Lesson1ShortcutNinjaRecent";
const MAX_RECENT_SIGNATURES = 40;

let questions=[],currentIndex=0,score=0;
let answerChecked=false,gameFinished=false,finishSubmitted=false;
let timerInterval=null,questionStartedAt=0,questionDeadline=0;
let interactionState={};
let recentSignatures=loadRecent();

const $=id=>document.getElementById(id);
$("playerName").textContent=player.playerName||"بازیکن";

function faNumber(v){
 return String(v).replace(/-/g,"−").replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}
function signed(v){return v>0?`+${faNumber(v)}`:faNumber(v)}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){
 const b=[...a];
 for(let i=b.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }
 return b;
}
function sum(a){return a.reduce((s,x)=>s+x,0)}

function loadRecent(){
 try{
  const a=JSON.parse(localStorage.getItem(RECENT_KEY)||"[]");
  return Array.isArray(a)?a.slice(-MAX_RECENT_SIGNATURES):[];
 }catch(e){return[]}
}
function saveRecent(qs){
 recentSignatures=[...recentSignatures,...qs.map(q=>q.signature)].slice(-MAX_RECENT_SIGNATURES);
 try{localStorage.setItem(RECENT_KEY,JSON.stringify(recentSignatures))}catch(e){}
}

/* =====================================================
   GENERATORS
   ===================================================== */

function genOneOppositePair(){
 const a=randInt(8,40);
 let extras=[randInt(2,15),-randInt(2,15)];
 while(extras[0]===-extras[1])extras=[randInt(2,15),-randInt(2,15)];
 const terms=shuffle([a,-a,...extras]);

 return {
  type:"zeroPairs",level:1,terms,required:1,
  prompt:"یک جفت قرینه پیدا کن که فوراً صفر شود.",
  hint:"دو عدد قرینه جمعشان صفر است.",
  explanation:`${signed(a)} و ${signed(-a)} قرینه‌اند؛ جمعشان صفر است و می‌توانی آن دو را بدون محاسبه طولانی حذف کنی.`,
  signature:`zp1-${a}-${terms.join("_")}`
 };
}

function genCancellationInLongSum(){
 const a=randInt(20,70),b=randInt(5,18),c=randInt(2,13);
 const terms=shuffle([-a,b,a,-c]);

 return {
  type:"zeroPairs",level:1,terms,required:1,
  prompt:"در این جمع طولانی، جفتی را پیدا کن که بهتر است اول حذف شود.",
  hint:"دنبال دو عددی بگرد که مجموعشان صفر باشد.",
  explanation:`${signed(-a)} و ${signed(a)} یک جفت صفر هستند. بعد از حذف آن‌ها فقط عددهای کوچک‌تر باقی می‌مانند.`,
  signature:`longcancel-${a}-${b}-${c}`
 };
}

function genTwoOppositePairs(){
 const a=randInt(8,35);
 let b=randInt(4,25);
 while(b===a)b=randInt(4,25);
 const extra=randInt(1,12);
 const terms=shuffle([a,-a,b,-b,extra]);

 return {
  type:"zeroPairs",level:2,terms,required:2,
  prompt:"دو جفت قرینه را پیدا و از میدان حذف کن.",
  hint:"هر جفت باید شامل x و −x باشد.",
  explanation:`دو جفت قرینه صفر می‌شوند و بدون محاسبه آن چهار جمله، فقط ${faNumber(extra)} باقی می‌ماند.`,
  signature:`zp2-${a}-${b}-${extra}`
 };
}

function genSmartGrouping(){
 const a=randInt(20,60);
 const b=randInt(5,20);
 const c=randInt(1,12);
 const d=-(b+c);
 const terms=shuffle([-a,b,a,d,c]);

 return {
  type:"zeroPairs",level:2,terms,required:1,
  prompt:"اول واضح‌ترین میان‌بُر را پیدا کن؛ کدام دو جمله بی‌درنگ حذف می‌شوند؟",
  hint:"لازم نیست از سمت چپ شروع کنی؛ جفت قرینه را پیدا کن.",
  explanation:`${signed(-a)} و ${signed(a)} بدون هیچ محاسبه‌ای صفر می‌شوند؛ این اولین میان‌بُر مناسب است.`,
  signature:`group-${a}-${b}-${c}`
 };
}

function genZeroFactor(){
 const k=randInt(3,12);
 const start=randInt(2,10);
 const end=start+randInt(5,10);
 let root=randInt(start,end);

 const factors=[];
 for(let i=start;i<=end;i++)factors.push({a:root,b:i,value:root-i});

 return {
  type:"zeroFactor",level:2,factors,
  prompt:"بدون انجام همه ضرب‌ها، عاملی را پیدا کن که کل حاصل‌ضرب را تعیین می‌کند.",
  hint:"اگر حتی یکی از عامل‌ها صفر باشد، تمام حاصل‌ضرب صفر است.",
  explanation:`عامل (${faNumber(root)}−${faNumber(root)}) برابر صفر است؛ بنابراین کل حاصل‌ضرب، بدون توجه به بقیه عامل‌ها، صفر می‌شود.`,
  signature:`zerofactor-${root}-${start}-${end}-${k}`
 };
}

function genZeroFactorClassic(){
 const root=randInt(2,9),end=root+randInt(6,13);
 const factors=[];
 for(let i=1;i<=end;i++)factors.push({a:root,b:i,value:root-i});

 return {
  type:"zeroFactor",level:2,factors,
  prompt:"عامل مخفیِ صفر را در این زنجیره شکار کن.",
  hint:"یکی از پرانتزها به شکل عدد منهای خودش است.",
  explanation:`(${faNumber(root)}−${faNumber(root)})=۰، پس کل ضرب برابر صفر است.`,
  signature:`classiczero-${root}-${end}`
 };
}

function genSequenceEven(){
 const end=pick([20,30,40,50,60,80,100]);
 return {
  type:"sequence",level:2,start:1,end,
  required:end/2,
  visibleCount:Math.min(end,10),
  prompt:`برای جمع ۱ تا ${faNumber(end)}، قانون جفت‌سازی ابتدا و انتها را کشف کن.`,
  hint:"اولین و آخرین، دومین و یکی‌مانده‌به‌آخر را با هم جفت کن.",
  pairSum:end+1,
  answer:(end*(end+1))/2,
  explanation:`هر جفت ${faNumber(end+1)} می‌شود و ${faNumber(end/2)} جفت داریم؛ پس حاصل ${faNumber((end/2)*(end+1))} است.`,
  signature:`seq-even-${end}`
 };
}

function genSequenceSmall(){
 const start=1,end=pick([10,12,14,16,18]);
 return {
  type:"sequence",level:2,start,end,required:end/2,
  visibleCount:end,
  prompt:"کارت‌های ابتدا و انتهای دنباله را جفت کن تا یک مجموع ثابت بسازی.",
  hint:"اگر قانون درست باشد، مجموع همه جفت‌ها برابر است.",
  pairSum:end+1,
  answer:end*(end+1)/2,
  explanation:`همه جفت‌ها ${faNumber(end+1)} می‌شوند؛ بنابراین لازم نیست اعداد را یکی‌یکی جمع کنی.`,
  signature:`seq-small-${end}`
 };
}

function genSequenceOdd(){
 const end=pick([9,11,15,19,25]);
 return {
  type:"sequence",level:3,start:1,end,
  required:Math.floor(end/2),
  visibleCount:end<=15?end:9,
  middle:(end+1)/2,
  pairSum:end+1,
  answer:end*(end+1)/2,
  prompt:`این دنباله تعداد فردی جمله دارد؛ جفت‌های ابتدا و انتها را پیدا کن.`,
  hint:"بعد از جفت‌کردن دو سر دنباله، یک عدد وسط بدون جفت می‌ماند.",
  explanation:`هر جفت ${faNumber(end+1)} است و عدد وسط ${faNumber((end+1)/2)} باقی می‌ماند؛ حاصل کل ${faNumber(end*(end+1)/2)} است.`,
  signature:`seq-odd-${end}`
 };
}

function genBestPair(){
 const target=pick([50,100]);
 const a=randInt(8,target-8);
 const b=target-a;
 const x=randInt(3,17);
 let y=randInt(3,17);
 while(x+y===target||x===a||y===b)y=randInt(3,17);
 const terms=shuffle([a,b,x,y]);

 return {
  type:"targetPair",level:3,terms,target,
  prompt:`دو عددی را پیدا کن که با هم ${faNumber(target)} می‌شوند و جمع را سریع‌تر می‌کنند.`,
  hint:"گاهی میان‌بُر، ساختن یک عدد رُند مثل ۵۰ یا ۱۰۰ است.",
  explanation:`${faNumber(a)} + ${faNumber(b)} = ${faNumber(target)}؛ ساختن عدد رُند ادامه محاسبه را ساده‌تر می‌کند.`,
  signature:`target-${target}-${a}-${b}-${x}-${y}`
 };
}

function genBestZeroAmongDistractors(){
 const a=randInt(15,45);
 const b=randInt(5,14);
 const terms=shuffle([a,-a,b,b+1,-b+2]);

 return {
  type:"zeroPairs",level:3,terms,required:1,
  prompt:"در میان چند جفت وسوسه‌کننده، میان‌بُری را انتخاب کن که محاسبه را کاملاً حذف می‌کند.",
  hint:"جمع‌های کوچک خوب‌اند؛ اما جفت صفر حتی بهتر است.",
  explanation:`${signed(a)} و ${signed(-a)} دقیقاً صفر می‌شوند و هیچ محاسبه دیگری برای آن دو لازم نیست.`,
  signature:`distract-${a}-${b}`
 };
}

function genZeroProductChoice(){
 const root=randInt(4,10);
 const data=[
  {text:`(${faNumber(root)}−${faNumber(root-1)})`,value:1},
  {text:`(${faNumber(root)}−${faNumber(root)})`,value:0},
  {text:`(${faNumber(root)}−${faNumber(root+1)})`,value:-1},
  {text:`(${faNumber(root+2)}−${faNumber(root)})`,value:2}
 ];

 return {
  type:"factorCards",level:3,factors:shuffle(data),
  prompt:"کدام عامل را کافی است بررسی کنی تا بفهمی کل ضرب صفر است؟",
  hint:"در حاصل‌ضرب، وجود یک عامل صفر برای تعیین کل جواب کافی است.",
  explanation:`عامل (${faNumber(root)}−${faNumber(root)}) صفر است؛ بنابراین کل حاصل‌ضرب صفر است.`,
  signature:`factorcards-${root}`
 };
}

const plan=[
 genOneOppositePair,
 genCancellationInLongSum,
 genTwoOppositePairs,
 genSmartGrouping,
 genZeroFactor,
 ()=>pick([genZeroFactorClassic,genZeroFactor])(),
 genSequenceSmall,
 ()=>pick([genSequenceEven,genBestPair])(),
 ()=>pick([genSequenceOdd,genBestZeroAmongDistractors])(),
 ()=>pick([genZeroProductChoice,genSequenceEven,genBestPair])()
];

function generateRound(){
 const result=[];

 for(const generator of plan){
  let q=null;

  for(let tries=0;tries<35;tries++){
   const candidate=generator();

   if(
    !recentSignatures.includes(candidate.signature) &&
    !result.some(x=>x.signature===candidate.signature)
   ){
    q=candidate;
    break;
   }
  }

  if(!q){
   for(let tries=0;tries<20;tries++){
    const candidate=generator();

    if(!result.some(x=>x.signature===candidate.signature)){
     q=candidate;
     break;
    }
   }
  }

  result.push(q||generator());
 }

 saveRecent(result);
 return result;
}

/* =====================================================
   STATE + RENDER
   ===================================================== */

function resetInteraction(){
 interactionState={
  selected:[],
  cleared:[],
  pairs:[],
  found:false
 };
}

function setLevel(level){
 const e=$("levelBadge");

 if(level===1){
  e.className="level";
  e.textContent="🟢 پایه";
 }else if(level===2){
  e.className="level master";
  e.textContent="🟡 تسلط";
 }else{
  e.className="level challenge";
  e.textContent="🔴 چالش";
 }
}

function renderQuestion(){
 stopTimer();

 answerChecked=false;
 resetInteraction();

 const q=questions[currentIndex];

 $("missionStatus").textContent=
  `${faNumber(currentIndex+1)} از ${faNumber(TOTAL_QUESTIONS)}`;

 $("scoreStatus").textContent=
  `${faNumber(score)} از ${faNumber(100)}`;

 setLevel(q.level);

 $("prompt").textContent=q.prompt;
 $("hint").textContent=q.hint;

 $("feedback").className="feedback";
 $("feedback").innerHTML="";

 $("checkBtn").hidden=false;
 $("checkBtn").disabled=false;
 $("nextBtn").hidden=true;
 $("resetBtn").disabled=false;

 renderWorkspace();
 startTimer();
}

function renderWorkspace(){
 const q=questions[currentIndex];
 const box=$("workspace");

 box.innerHTML="";

 if(q.type==="zeroPairs"){
  renderZeroPairs(q,box);
 }

 if(q.type==="zeroFactor"){
  renderZeroFactor(q,box);
 }

 if(q.type==="factorCards"){
  renderFactorCards(q,box);
 }

 if(q.type==="sequence"){
  renderSequence(q,box);
 }

 if(q.type==="targetPair"){
  renderTargetPair(q,box);
 }

 updateMeter();
}

function renderZeroPairs(q,box){
 const row=document.createElement("div");
 row.className="expression";

 q.terms.forEach((term,index)=>{
  const b=document.createElement("button");

  b.type="button";
  b.className="term";
  b.textContent=signed(term);

  if(interactionState.selected.includes(index)){
   b.classList.add("selected");
  }

  if(interactionState.cleared.includes(index)){
   b.classList.add("cleared");
   b.disabled=true;
  }

  b.addEventListener("click",()=>{
   choosePairItem(index,q.terms,"zero");
  });

  row.appendChild(b);
 });

 box.appendChild(row);

 $("discovery").textContent=
  interactionState.pairs.length
   ? `⚡ ${faNumber(interactionState.pairs.length)} جفت صفر کشف شد.`
   : "دو جمله‌ای را لمس کن که همدیگر را خنثی می‌کنند.";
}

function renderTargetPair(q,box){
 const row=document.createElement("div");
 row.className="expression";

 q.terms.forEach((term,index)=>{
  const b=document.createElement("button");

  b.type="button";
  b.className="term";
  b.textContent=faNumber(term);

  if(interactionState.selected.includes(index)){
   b.classList.add("selected");
  }

  if(interactionState.cleared.includes(index)){
   b.classList.add("cleared");
   b.disabled=true;
  }

  b.addEventListener("click",()=>{
   choosePairItem(index,q.terms,"target");
  });

  row.appendChild(b);
 });

 box.appendChild(row);

 $("discovery").textContent=
  interactionState.pairs.length
   ? `⚡ جفتِ ${faNumber(q.target)} ساخته شد.`
   : `دو کارت را برای ساختن ${faNumber(q.target)} انتخاب کن.`;
}

function choosePairItem(index,values,mode){
 if(answerChecked)return;

 if(interactionState.cleared.includes(index))return;

 const pos=interactionState.selected.indexOf(index);

 if(pos>=0){
  interactionState.selected.splice(pos,1);
  renderWorkspace();
  return;
 }

 if(interactionState.selected.length===1){
  const firstIndex=interactionState.selected[0];
  const first=values[firstIndex];
  const second=values[index];

  const q=questions[currentIndex];

  const correct=
   mode==="zero"
    ? first+second===0
    : first+second===q.target;

  if(correct){
   interactionState.pairs.push([firstIndex,index]);
   interactionState.cleared.push(firstIndex,index);
   interactionState.selected=[];
   renderWorkspace();
   return;
  }

  interactionState.selected=[];
  showMidFeedback(
   mode==="zero"
    ? "این دو عدد قرینه نیستند؛ مجموعشان صفر نمی‌شود."
    : `این دو عدد ${faNumber(q.target)} نمی‌شوند.`
  );

  animate("shake");
  renderWorkspace();
  return;
 }

 interactionState.selected=[index];
 renderWorkspace();
}

function renderZeroFactor(q,box){
 const row=document.createElement("div");
 row.className="expression";

 q.factors.forEach((factor,index)=>{
  const b=document.createElement("button");

  b.type="button";
  b.className="factor";
  b.textContent=
   `(${faNumber(factor.a)}−${faNumber(factor.b)})`;

  if(interactionState.selected.includes(index)){
   b.classList.add("selected");
  }

  if(
   interactionState.found &&
   factor.value===0
  ){
   b.classList.add("found");
  }

  b.addEventListener("click",()=>{
   if(answerChecked)return;

   interactionState.selected=[index];

   if(factor.value===0){
    interactionState.found=true;
    $("discovery").textContent="⚡ عامل صفر پیدا شد؛ دیگر هیچ ضربی لازم نیست!";
   }else{
    $("discovery").textContent=
     `${b.textContent} صفر نیست؛ دنبال عاملی بگرد که کل ضرب را خاموش کند.`;

    animate("shake");
   }

   renderWorkspace();
  });

  row.appendChild(b);

  if(index<q.factors.length-1){
   const op=document.createElement("span");
   op.className="operator";
   op.textContent="×";
   row.appendChild(op);
  }
 });

 box.appendChild(row);

 if(!interactionState.found){
  $("discovery").textContent=
   "یک عامل را لمس کن؛ هدف پیدا کردن عامل صفر است.";
 }
}

function renderFactorCards(q,box){
 const row=document.createElement("div");
 row.className="expression";

 q.factors.forEach((factor,index)=>{
  const b=document.createElement("button");

  b.type="button";
  b.className="factor";
  b.textContent=factor.text;

  if(interactionState.selected.includes(index)){
   b.classList.add("selected");
  }

  if(interactionState.found && factor.value===0){
   b.classList.add("found");
  }

  b.addEventListener("click",()=>{
   if(answerChecked)return;

   interactionState.selected=[index];
   interactionState.found=factor.value===0;

   if(factor.value===0){
    $("discovery").textContent=
     "⚡ درست! همین یک عامل کافی است تا کل ضرب صفر شود.";
   }else{
    $("discovery").textContent=
     `این عامل برابر ${faNumber(factor.value)} است، نه صفر.`;

    animate("shake");
   }

   renderWorkspace();
  });

  row.appendChild(b);
 });

 box.appendChild(row);

 if(!interactionState.found){
  $("discovery").textContent=
   "عامل تعیین‌کننده کل حاصل‌ضرب را شکار کن.";
 }
}

function sequenceVisibleValues(q){
 if(q.visibleCount>=q.end-q.start+1){
  const result=[];

  for(let i=q.start;i<=q.end;i++){
   result.push(i);
  }

  return result;
 }

 /*
   برای دنباله‌های بلند فقط چند کارت ابتدا و انتها نمایش داده می‌شود.
   این کارت‌ها برای کشف قانون‌اند؛ لازم نیست تمام ۱۰۰ کارت ساخته شود.
 */
 const count=Math.floor(q.visibleCount/2);
 const values=[];

 for(let i=0;i<count;i++){
  values.push(q.start+i);
 }

 for(let i=count-1;i>=0;i--){
  values.push(q.end-i);
 }

 return values;
}

function renderSequence(q,box){
 const values=sequenceVisibleValues(q);

 const row=document.createElement("div");
 row.className="sequence";

 values.forEach((value,index)=>{
  const b=document.createElement("button");

  b.type="button";
  b.className="seq-card";
  b.textContent=faNumber(value);

  if(interactionState.selected.includes(index)){
   b.classList.add("selected");
  }

  if(interactionState.cleared.includes(index)){
   b.classList.add("paired");
   b.disabled=true;
  }

  b.addEventListener("click",()=>{
   chooseSequence(index,values);
  });

  row.appendChild(b);
 });

 if(q.visibleCount<q.end-q.start+1){
  const dots=document.createElement("span");
  dots.className="operator";
  dots.textContent="…";
  row.insertBefore(
   dots,
   row.children[Math.floor(row.children.length/2)] || null
  );
 }

 box.appendChild(row);

 const pairs=document.createElement("div");
 pairs.className="pairs";

 interactionState.pairs.forEach(pair=>{
  const chip=document.createElement("span");
  chip.className="pair-chip";

  chip.textContent=
   `${faNumber(pair[0])}+${faNumber(pair[1])}=${faNumber(pair[0]+pair[1])}`;

  pairs.appendChild(chip);
 });

 box.appendChild(pairs);

 if(interactionState.pairs.length===0){
  $("discovery").textContent=
   "دو سر دنباله را امتحان کن و ببین مجموعشان چه الگویی دارد.";
 }else{
  $("discovery").textContent=
   `⚡ مجموع جفت‌های کشف‌شده ${faNumber(q.pairSum)} است.`;
 }
}

function chooseSequence(index,values){
 if(answerChecked)return;

 if(interactionState.cleared.includes(index))return;

 const existing=
  interactionState.selected.indexOf(index);

 if(existing>=0){
  interactionState.selected.splice(existing,1);
  renderWorkspace();
  return;
 }

 if(interactionState.selected.length===0){
  interactionState.selected=[index];
  renderWorkspace();
  return;
 }

 const firstIndex=interactionState.selected[0];
 const a=values[firstIndex];
 const b=values[index];
 const q=questions[currentIndex];

 if(a+b===q.pairSum){
  interactionState.pairs.push([a,b]);
  interactionState.cleared.push(firstIndex,index);
  interactionState.selected=[];
 }else{
  interactionState.selected=[];

  showMidFeedback(
   `این جفت ${faNumber(a+b)} می‌شود. دنبال جفت‌هایی با مجموع ثابت ${faNumber(q.pairSum)} باش.`
  );

  animate("shake");
 }

 renderWorkspace();
}

function updateMeter(){
 const q=questions[currentIndex];

 if(q.type==="zeroPairs"){
  $("meter").innerHTML=
   `جفت صفر پیدا شده: <strong>${faNumber(interactionState.pairs.length)} از ${faNumber(q.required)}</strong>`;
 }

 if(q.type==="targetPair"){
  $("meter").innerHTML=
   `جفت رُند پیدا شده: <strong>${interactionState.pairs.length?"آماده ✓":"هنوز نه"}</strong>`;
 }

 if(q.type==="zeroFactor" || q.type==="factorCards"){
  $("meter").innerHTML=
   `عامل صفر: <strong>${interactionState.found?"پیدا شد ✓":"هنوز پیدا نشده"}</strong>`;
 }

 if(q.type==="sequence"){
  const neededForPattern=
   Math.min(2,Math.floor(sequenceVisibleValues(q).length/2));

  $("meter").innerHTML=
   `جفت‌های لازم برای کشف الگو: <strong>${faNumber(Math.min(interactionState.pairs.length,neededForPattern))} از ${faNumber(neededForPattern)}</strong>`;
 }
}

$("resetBtn").addEventListener("click",()=>{
 if(answerChecked)return;

 resetInteraction();

 $("feedback").className="feedback";
 renderWorkspace();
});

function showMidFeedback(text){
 const f=$("feedback");

 f.className="feedback show timeout";
 f.innerHTML=
  `<strong>🥷 این میان‌بُر هنوز مناسب نیست.</strong>${text}`;
}

/* =====================================================
   EVALUATION
   ===================================================== */

function evaluate(q){
 if(q.type==="zeroPairs"){
  return {
   ready:interactionState.pairs.length>=q.required,
   correct:interactionState.pairs.length>=q.required
  };
 }

 if(q.type==="targetPair"){
  return {
   ready:interactionState.pairs.length>=1,
   correct:interactionState.pairs.length>=1
  };
 }

 if(q.type==="zeroFactor" || q.type==="factorCards"){
  return {
   ready:interactionState.selected.length===1,
   correct:interactionState.found
  };
 }

 if(q.type==="sequence"){
  const needed=
   Math.min(
    2,
    Math.floor(sequenceVisibleValues(q).length/2)
   );

  return {
   ready:interactionState.pairs.length>=needed,
   correct:
    interactionState.pairs.length>=needed &&
    interactionState.pairs.every(
     pair=>pair[0]+pair[1]===q.pairSum
    )
  };
 }

 return {ready:false,correct:false};
}

function correctText(q){
 if(q.type==="zeroPairs"){
  for(let i=0;i<q.terms.length;i++){
   for(let j=i+1;j<q.terms.length;j++){
    if(q.terms[i]+q.terms[j]===0){
     return `${signed(q.terms[i])} و ${signed(q.terms[j])}`;
    }
   }
  }
 }

 if(q.type==="targetPair"){
  for(let i=0;i<q.terms.length;i++){
   for(let j=i+1;j<q.terms.length;j++){
    if(q.terms[i]+q.terms[j]===q.target){
     return `${faNumber(q.terms[i])} و ${faNumber(q.terms[j])}`;
    }
   }
  }
 }

 if(q.type==="zeroFactor"){
  const f=q.factors.find(x=>x.value===0);

  if(f){
   return `(${faNumber(f.a)}−${faNumber(f.b)})`;
  }
 }

 if(q.type==="factorCards"){
  const f=q.factors.find(x=>x.value===0);
  return f?f.text:"";
 }

 if(q.type==="sequence"){
  return `${faNumber(q.start)}+${faNumber(q.end)}=${faNumber(q.pairSum)}`;
 }

 return "";
}

function scoreForElapsed(ms){
 const seconds=ms/1000;

 if(seconds<=5)return 10;
 if(seconds<=10)return 8;
 if(seconds<=15)return 6;
 if(seconds<=20)return 4;
 if(seconds<=30)return 2;

 return 0;
}

function lockInteraction(){
 $("checkBtn").disabled=true;
 $("resetBtn").disabled=true;

 [...$("workspace").querySelectorAll("button")]
  .forEach(button=>button.disabled=true);
}

function showFeedback(kind,title,text){
 const f=$("feedback");

 f.className=`feedback show ${kind}`;
 f.innerHTML=`<strong>${title}</strong>${text}`;
}

function animate(cls){
 const e=$("gameCard");

 e.classList.remove(cls);
 void e.offsetWidth;
 e.classList.add(cls);

 setTimeout(()=>{
  e.classList.remove(cls);
 },350);
}

function checkAnswer(){
 if(answerChecked||gameFinished)return;

 if(Date.now()>=questionDeadline){
  handleTimeout();
  return;
 }

 const q=questions[currentIndex];
 const result=evaluate(q);

 if(!result.ready){
  showFeedback(
   "timeout",
   "میان‌بُر هنوز کامل نشده.",
   q.type==="sequence"
    ? "حداقل دو جفت با مجموع ثابت بساز تا نشان بدهی الگو را پیدا کرده‌ای."
    : "اول عنصر یا جفت کلیدی را در خود عبارت پیدا کن."
  );

  return;
 }

 answerChecked=true;
 stopTimer();
 lockInteraction();

 if(result.correct){
  const gained=
   scoreForElapsed(Date.now()-questionStartedAt);

  score=Math.min(100,score+gained);

  $("scoreStatus").textContent=
   `${faNumber(score)} از ${faNumber(100)}`;

  showFeedback(
   "good",
   `✅ میان‌بُر کشف شد! +${faNumber(gained)} امتیاز`,
   q.explanation
  );

  animate("pop");
 }else{
  showFeedback(
   "bad",
   "❌ این انتخاب محاسبه را به شکل هدف کوتاه نمی‌کند.",
   `عنصر کلیدی: ${correctText(q)}<br>${q.explanation}`
  );

  animate("shake");
 }

 $("checkBtn").hidden=true;
 $("nextBtn").hidden=false;

 $("nextBtn").textContent=
  currentIndex===TOTAL_QUESTIONS-1
   ? "دیدن نتیجه 🏁"
   : "مأموریت بعدی";
}

$("checkBtn").addEventListener("click",checkAnswer);

function handleTimeout(){
 if(answerChecked||gameFinished)return;

 answerChecked=true;
 stopTimer();
 lockInteraction();

 const q=questions[currentIndex];

 showFeedback(
  "timeout",
  "⏰ زمان تمام شد.",
  `میان‌بُر پیشنهادی: ${correctText(q)}<br>${q.explanation}`
 );

 $("checkBtn").hidden=true;
 $("nextBtn").hidden=false;

 $("nextBtn").textContent=
  currentIndex===TOTAL_QUESTIONS-1
   ? "دیدن نتیجه 🏁"
   : "مأموریت بعدی";
}

/* =====================================================
   TIMER
   ===================================================== */

function startTimer(){
 stopTimer();

 questionStartedAt=Date.now();
 questionDeadline=
  questionStartedAt+QUESTION_TIME*1000;

 updateTimer();

 timerInterval=
  setInterval(updateTimer,100);
}

function updateTimer(){
 if(answerChecked||gameFinished)return;

 const remaining=
  Math.max(0,questionDeadline-Date.now());

 const ratio=
  remaining/(QUESTION_TIME*1000);

 $("timeText").textContent=
  `${faNumber(Math.ceil(remaining/1000))} ثانیه`;

 $("timerFill").style.width=
  `${Math.max(0,Math.min(100,ratio*100))}%`;

 $("timerFill").style.background=
  ratio>.5
   ? "#51dd91"
   : ratio>.2
   ? "#f5c543"
   : "#e65362";

 if(remaining<=0){
  handleTimeout();
 }
}

function stopTimer(){
 if(timerInterval!==null){
  clearInterval(timerInterval);
  timerInterval=null;
 }
}

/* =====================================================
   FLOW
   ===================================================== */

$("nextBtn").addEventListener("click",()=>{
 if(!answerChecked||gameFinished)return;

 if(currentIndex===TOTAL_QUESTIONS-1){
  finishGame();
  return;
 }

 currentIndex++;
 renderQuestion();
});

async function finishGame(){
 if(gameFinished)return;

 gameFinished=true;
 stopTimer();

 $("playArea").style.display="none";
 $("resultArea").classList.add("show");

 $("finalScore").textContent=faNumber(score);

 $("resultName").textContent=
  `${player.playerName||"بازیکن"}، امتیاز نهایی تو:`;

 $("resultMessage").textContent=
  score>=90
   ? "عالی! قبل از شروع محاسبه، ساختار عبارت را می‌بینی و راه کوتاه‌تر را پیدا می‌کنی. 🌟"
   : score>=70
   ? "خیلی خوب! جفت قرینه و عامل صفر را سریع پیدا می‌کنی؛ روی الگوی دنباله‌ها هم ادامه بده. ⚡"
   : score>=50
   ? "میان‌بُرهای اصلی را می‌شناسی؛ قبل از حساب‌کردن همیشه چند ثانیه دنبال ساختار بگرد. 🥷"
   : "در دور بعد قبل از هر محاسبه سه چیز را جست‌وجو کن: جفت صفر، عامل صفر و جفت‌هایی با مجموع ثابت.";

 if(!finishSubmitted){
  finishSubmitted=true;

  try{
   await GameSDK.finishGame(score);
  }catch(error){
   console.error(
    "finishGame failed",
    error
   );
  }
 }

 await loadLeaderboard();
}

async function loadLeaderboard(){
 const box=$("leaderRows");

 box.innerHTML=
  '<div style="text-align:center;color:#707890">در حال دریافت...</div>';

 try{
  const scores=
   await GameSDK.getLeaderboard(10);

  if(!scores||!scores.length){
   box.innerHTML=
    '<div style="text-align:center;color:#707890">هنوز رکوردی ثبت نشده است.</div>';

   return;
  }

  box.innerHTML="";

  scores.forEach((entry,index)=>{
   const row=
    document.createElement("div");

   row.className="leader-row";

   const rank=
    index===0
     ? "🥇"
     : index===1
     ? "🥈"
     : index===2
     ? "🥉"
     : `${faNumber(index+1)}.`;

   const left=
    document.createElement("span");

   left.textContent=
    `${rank} ${entry.playerName??entry.name??"بازیکن"}`;

   const right=
    document.createElement("strong");

   right.textContent=
    `${faNumber(entry.score??0)} امتیاز`;

   row.append(left,right);
   box.appendChild(row);
  });

 }catch(error){
  console.error(
   "leaderboard failed",
   error
  );

  box.innerHTML=
   '<div class="error">جدول برترین‌ها فعلاً قابل دریافت نیست.</div>';
 }
}

$("restartBtn").addEventListener("click",()=>{
 stopTimer();

 try{
  GameSDK.reset();
 }catch(error){
  console.error(
   "reset failed",
   error
  );
 }

 score=0;
 currentIndex=0;
 answerChecked=false;
 gameFinished=false;
 finishSubmitted=false;
 interactionState={};

 $("scoreStatus").textContent=
  "۰ از ۱۰۰";

 $("playArea").style.display="";
 $("resultArea").classList.remove("show");

 questions=generateRound();

 renderQuestion();
});

/* =====================================================
   INIT
   ===================================================== */

function init(){
 questions=generateRound();

 if(questions.length!==TOTAL_QUESTIONS){
  throw new Error(
   "Exactly 10 missions are required."
  );
 }

 renderQuestion();
}

init();
</script>
