<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ریل اعداد 🚂📍 | ریاضی هشتم</title>
<style>
:root{
  --purple:#7456d8;
  --blue:#3e82ed;
  --pink:#eb70a7;
  --yellow:#f4c542;
  --green:#28ae78;
  --red:#e55161;
  --ink:#29334b;
  --muted:#6c7690;
  --paper:#fff;
  --shadow:0 10px 28px rgba(61,53,110,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
  font-family:Tahoma,Arial,sans-serif;
  color:var(--ink);
  line-height:1.65;
  background:
    radial-gradient(circle at 10% 4%,#e7e2ff 0,transparent 28%),
    radial-gradient(circle at 92% 14%,#ddf4ff 0,transparent 25%),
    #f7f7fc;
}
button{font:inherit}
button:focus-visible{outline:3px solid #277ee8;outline-offset:3px}
.app{width:min(100%,920px);margin:auto;padding:14px 12px 30px}

.header{
  background:linear-gradient(135deg,#7353d6,#4085eb);
  color:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow)
}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{
  padding:3px 9px;border-radius:99px;font-size:11px;font-weight:bold;
  background:rgba(255,255,255,.17);
  border:1px solid rgba(255,255,255,.26)
}
.header h1{font-size:clamp(23px,6vw,34px);margin:8px 0 2px}
.subtitle{margin:0;color:#f2efff;font-size:13px}

.status{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.status-card{
  min-width:0;background:#fff;color:var(--ink);
  border-radius:13px;padding:6px 3px;text-align:center
}
.status-card small{display:block;color:var(--muted);font-size:10px}
.status-card strong{
  display:block;font-size:14px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}

.timer-box{
  margin-top:9px;padding:7px;border-radius:13px;
  background:rgba(255,255,255,.15)
}
.timer-head{display:flex;justify-content:space-between;font-size:12px}
.timer-track{
  height:9px;margin-top:5px;background:rgba(255,255,255,.22);
  border-radius:99px;overflow:hidden
}
.timer-fill{
  width:100%;height:100%;background:#51dd91;
  border-radius:inherit;transition:width .15s linear,background-color .2s
}

.game-card{
  background:#fff;border-radius:22px;margin-top:13px;
  padding:15px;box-shadow:var(--shadow);min-height:480px
}
.topline{display:flex;justify-content:space-between;gap:8px;align-items:center}
.level{
  padding:4px 10px;border-radius:99px;font-size:12px;
  font-weight:bold;background:#e9f8ef;color:#18794d
}
.level.master{background:#fff3cb;color:#936700}
.level.challenge{background:#ffe9ee;color:#bb3850}
.mini-note{font-size:12px;color:#707890}

.prompt{
  max-width:700px;margin:16px auto 4px;text-align:center;
  font-weight:bold;font-size:clamp(16px,4.5vw,20px)
}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-bottom:9px}

.station{
  max-width:760px;margin:13px auto;
  background:linear-gradient(135deg,#f4f8ff,#f8f5ff);
  border:1px solid #d9deef;border-radius:20px;
  padding:13px 8px 18px;overflow:hidden
}
.station-title{text-align:center;font-size:12px;color:#68758b;font-weight:bold}

.axis-wrap{
  direction:ltr;
  position:relative;
  padding:62px 18px 57px;
  margin:4px auto 0;
  touch-action:manipulation
}
.axis{
  position:relative;height:8px;background:#59687a;
  border-radius:8px;box-shadow:0 6px 0 #bcc5ce
}
.axis::before{
  content:"";position:absolute;left:0;right:0;top:-9px;height:26px;
  background:repeating-linear-gradient(
    90deg,
    transparent 0 18px,
    rgba(91,104,120,.27) 18px 21px,
    transparent 21px 34px
  )
}
.tick{
  position:absolute;top:-9px;width:2px;height:26px;
  background:#465569;transform:translateX(-50%);z-index:2
}
.tick.zero{width:4px;height:36px;top:-14px;background:#7456d8}
.tick-label{
  position:absolute;top:29px;left:50%;transform:translateX(-50%);
  color:#465268;font-size:11px;white-space:nowrap
}
.tick-btn{
  position:absolute;left:50%;top:-22px;
  transform:translateX(-50%);
  width:36px;height:72px;border:0;background:transparent;
  cursor:pointer;z-index:8
}
.train{
  position:absolute;top:-54px;
  transform:translateX(-50%);
  font-size:33px;z-index:10;
  transition:left .25s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(0 3px 3px rgba(50,60,80,.3));
  pointer-events:none
}
.selected-dot{
  position:absolute;top:-5px;
  width:18px;height:18px;border-radius:50%;
  transform:translateX(-50%);
  background:#f4c542;border:3px solid white;
  box-shadow:0 0 0 2px #d79800;z-index:9;
  pointer-events:none
}
.marker{
  position:absolute;top:-17px;
  width:4px;height:40px;background:#7456d8;
  transform:translateX(-50%);border-radius:5px;z-index:5
}
.marker-label{
  position:absolute;top:-49px;
  transform:translateX(-50%);
  background:#7456d8;color:white;
  border-radius:9px;padding:3px 8px;
  font-weight:bold;font-size:12px;z-index:6;white-space:nowrap
}
.range{
  position:absolute;top:-7px;height:22px;
  background:rgba(39,174,120,.24);
  border-top:2px solid #28ae78;
  border-bottom:2px solid #28ae78;z-index:1
}

.cards{
  display:flex;justify-content:center;align-items:center;
  flex-wrap:wrap;gap:8px;margin:12px auto 4px
}
.num-card{
  min-width:62px;min-height:50px;
  border:2px solid #dad9eb;background:#fff;
  color:var(--ink);border-radius:14px;
  padding:7px 12px;font-size:18px;font-weight:bold;
  cursor:pointer;box-shadow:0 4px 9px rgba(57,63,100,.06)
}
.num-card.selected{
  border-color:#7456d8;background:#eeeaff;
  color:#6545c9;transform:translateY(-2px)
}
.num-card.used{opacity:.4}

.order-zone{
  min-height:67px;max-width:620px;margin:11px auto 0;
  padding:8px;border-radius:15px;
  border:2px dashed #cac7e3;background:#fbfaff;
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:7px
}
.order-chip{
  min-height:40px;border:0;border-radius:10px;
  background:#7456d8;color:#fff;
  padding:6px 10px;font-weight:bold;cursor:pointer
}
.empty-text{font-size:12px;color:#81889c}

.action-row{
  display:flex;justify-content:center;gap:8px;
  flex-wrap:wrap;margin-top:14px
}
.btn{
  min-height:48px;border:0;border-radius:14px;
  padding:9px 18px;font-weight:bold;cursor:pointer
}
.btn-primary{background:linear-gradient(135deg,#7556d7,#4283e9);color:#fff}
.btn-secondary{background:#edf0f6;color:#3f485f}
.btn:disabled{opacity:.45;cursor:not-allowed}

.feedback{
  display:none;margin-top:13px;padding:11px 13px;
  border-radius:14px;font-size:14px
}
.feedback.show{display:block}
.feedback.good{
  background:#e8f8ef;border:1px solid #a9ddbf;color:#176b43
}
.feedback.bad{
  background:#ffebee;border:1px solid #efb4bd;color:#a62a40
}
.feedback.timeout{
  background:#fff3da;border:1px solid #e9ca85;color:#835c00
}
.feedback strong{display:block;margin-bottom:1px}

.result{display:none;text-align:center}
.result.show{display:block}
.score-circle{
  width:128px;height:128px;border-radius:50%;margin:17px auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#e7e1ff,#daf3ff);
  border:7px solid white;box-shadow:0 0 0 3px #7456d8
}
.score-circle strong{font-size:35px;color:#6544cf}
.score-circle small{color:#667}
.leaderboard{
  max-width:530px;margin:18px auto;background:#f8f8fc;
  border-radius:16px;padding:10px;text-align:right
}
.leader-row{
  display:flex;justify-content:space-between;gap:8px;
  padding:8px 6px;border-bottom:1px solid #e2e2ec
}
.leader-row:last-child{border-bottom:0}
.error{color:#aa3045;text-align:center;font-size:12px}

.back{
  display:block;text-align:center;margin:17px auto;
  color:#604bbc;font-weight:bold;text-decoration:none
}
.pop{animation:pop .28s ease}
.shake{animation:shake .28s ease}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{
  25%{transform:translateX(4px)}
  50%{transform:translateX(-4px)}
  75%{transform:translateX(3px)}
}

@media(min-width:650px){
  .app{padding:22px 18px 40px}
  .header{padding:20px}
  .game-card{padding:22px}
  .tick-label{font-size:12px}
  .axis-wrap{padding-left:28px;padding-right:28px}
}
@media(max-width:390px){
  .axis-wrap{padding-left:10px;padding-right:10px}
  .tick-label{font-size:10px}
  .num-card{min-width:55px;padding:6px 9px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important
  }
}
</style>
</head>
<body>

<main class="app">
<header class="header">
  <div class="badges">
    <span class="badge">پایه هشتم</span>
    <span class="badge">فصل ۱</span>
    <span class="badge">درس ۱</span>
  </div>

  <h1>ریل اعداد 🚂📍</h1>
  <p class="subtitle">عددهای صحیح را با جای واقعی‌شان روی محور بشناس.</p>

  <div class="status">
    <div class="status-card">
      <small>بازیکن</small>
      <strong id="playerName">...</strong>
    </div>
    <div class="status-card">
      <small>مأموریت</small>
      <strong id="missionStatus">۱ از ۱۰</strong>
    </div>
    <div class="status-card">
      <small>امتیاز</small>
      <strong id="scoreStatus">۰ از ۱۰۰</strong>
    </div>
  </div>

  <div class="timer-box">
    <div class="timer-head">
      <span>⏱ زمان باقی‌مانده</span>
      <strong id="timeText">۳۰ ثانیه</strong>
    </div>
    <div class="timer-track">
      <div id="timerFill" class="timer-fill"></div>
    </div>
  </div>
</header>

<section id="gameCard" class="game-card">

  <div id="playArea">
    <div class="topline">
      <span id="levelBadge" class="level">🟢 پایه</span>
      <span class="mini-note">راست‌تر = بزرگ‌تر 🚂</span>
    </div>

    <div id="prompt" class="prompt"></div>
    <div id="hint" class="hint"></div>

    <div class="station">
      <div id="stationTitle" class="station-title">ایستگاه عددها</div>

      <div class="axis-wrap">
        <div id="axis" class="axis"></div>
      </div>

      <div id="cards" class="cards"></div>
      <div id="orderZone" class="order-zone" hidden></div>
    </div>

    <div class="action-row">
      <button id="clearBtn" class="btn btn-secondary" type="button">پاک کردن</button>
      <button id="checkBtn" class="btn btn-primary" type="button">ثبت پاسخ</button>
      <button id="nextBtn" class="btn btn-primary" type="button" hidden>مأموریت بعدی</button>
    </div>

    <div id="feedback" class="feedback" aria-live="polite"></div>
  </div>

  <div id="resultArea" class="result">
    <div style="font-size:48px">🚂🏁</div>
    <h2>به ایستگاه آخر رسیدی!</h2>
    <p id="resultName"></p>

    <div class="score-circle">
      <strong id="finalScore">۰</strong>
      <small>از ۱۰۰</small>
    </div>

    <p id="resultMessage"></p>

    <button id="restartBtn" class="btn btn-primary" type="button">
      🔄 بازی دوباره
    </button>

    <div class="leaderboard">
      <h3 style="text-align:center;margin:5px">🏆 برترین‌های ریل</h3>
      <div id="leaderRows">
        <div style="text-align:center;color:#707890">در حال دریافت...</div>
      </div>
    </div>
  </div>

</section>

<a class="back" href="/#game">← بازگشت به بازی‌های ریاضی</a>
</main>

<script src="/games/game-sdk.js"></script>
<script>
"use strict";

const GAME_ID = 21;
const player = GameSDK.init(GAME_ID);

const TOTAL_QUESTIONS = 10;
const QUESTION_TIME = 30;

const RECENT_KEY = "grade8Lesson1IntegerRailRecent";
const MAX_RECENT_SIGNATURES = 40;

let questions = [];
let currentIndex = 0;
let score = 0;

let answerChecked = false;
let gameFinished = false;
let finishSubmitted = false;

let timerInterval = null;
let questionStartedAt = 0;
let questionDeadline = 0;

let interactionState = {};
let recentSignatures = loadRecentSignatures();

const $ = id => document.getElementById(id);

$("playerName").textContent = player.playerName || "بازیکن";

function faNumber(value){
  return String(value)
    .replace(/-/g,"−")
    .replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(array){
  return array[Math.floor(Math.random()*array.length)];
}

function shuffle(array){
  const result=[...array];

  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }

  return result;
}

function uniqueIntegers(count,min,max){
  const set=new Set();

  while(set.size<count){
    set.add(randInt(min,max));
  }

  return [...set];
}

function loadRecentSignatures(){
  try{
    const value=JSON.parse(localStorage.getItem(RECENT_KEY)||"[]");

    return Array.isArray(value)
      ? value.slice(-MAX_RECENT_SIGNATURES)
      : [];
  }catch(error){
    return [];
  }
}

function saveRecentSignatures(round){
  recentSignatures=[
    ...recentSignatures,
    ...round.map(q=>q.signature)
  ].slice(-MAX_RECENT_SIGNATURES);

  try{
    localStorage.setItem(
      RECENT_KEY,
      JSON.stringify(recentSignatures)
    );
  }catch(error){}
}

/* =========================================================
   GENERATORS
   ========================================================= */

function genLocatePositive(){
  const target=randInt(1,9);

  return {
    type:"locate",
    level:1,
    min:-10,
    max:10,
    target,
    prompt:`قطار را روی عدد ${faNumber(target)} متوقف کن.`,
    hint:"هر خط روی ریل یک عدد صحیح است.",
    explanation:`عدد ${faNumber(target)} در سمت راست صفر و ${faNumber(target)} واحد با صفر فاصله دارد.`,
    signature:`loc-pos-${target}`
  };
}

function genLocateNegative(){
  const target=-randInt(1,9);

  return {
    type:"locate",
    level:1,
    min:-10,
    max:10,
    target,
    prompt:`ایستگاه ${faNumber(target)} را روی محور پیدا کن.`,
    hint:"عددهای منفی در سمت چپ صفر قرار دارند.",
    explanation:`${faNumber(target)} در سمت چپ صفر قرار دارد و فاصله‌اش از صفر ${faNumber(Math.abs(target))} واحد است.`,
    signature:`loc-neg-${target}`
  };
}

function genOpposite(){
  const source=randInt(-9,9);

  return {
    type:"locate",
    level:1,
    min:-10,
    max:10,
    target:-source,
    prompt:`قطار را روی قرینه ${faNumber(source)} متوقف کن.`,
    hint:"قرینه در طرف دیگر صفر و در همان فاصله قرار دارد.",
    explanation:
      source===0
      ? "صفر قرینه خودش است."
      : `قرینه ${faNumber(source)} برابر ${faNumber(-source)} است؛ هر دو فاصله یکسانی از صفر دارند.`,
    signature:`opposite-${source}`
  };
}

function genCompareNegative(){
  let a=-randInt(1,9);
  let b=-randInt(1,9);

  while(a===b){
    b=-randInt(1,9);
  }

  return {
    type:"chooseGreater",
    level:2,
    min:-10,
    max:2,
    a,
    b,
    choices:shuffle([a,b]),
    prompt:"کدام عدد منفی بزرگ‌تر است؟",
    hint:"محور را نگاه کن؛ عدد راست‌تر بزرگ‌تر است.",
    explanation:
      a>b
      ? `${faNumber(a)} راست‌تر از ${faNumber(b)} قرار دارد؛ پس بزرگ‌تر است.`
      : `${faNumber(b)} راست‌تر از ${faNumber(a)} قرار دارد؛ پس بزرگ‌تر است.`,
    signature:`greater-neg-${Math.min(a,b)}-${Math.max(a,b)}`
  };
}

function genCompareMixed(){
  let a=randInt(-8,8);
  let b=randInt(-8,8);

  while(a===b){
    b=randInt(-8,8);
  }

  return {
    type:"chooseGreater",
    level:2,
    min:-10,
    max:10,
    a,
    b,
    choices:shuffle([a,b]),
    prompt:"کدام عدد روی محور راست‌تر و در نتیجه بزرگ‌تر است؟",
    hint:"برای مقایسه، علامت یا اندازه رقم کافی نیست؛ جای عدد روی محور را ببین.",
    explanation:
      a>b
      ? `${faNumber(a)} از ${faNumber(b)} بزرگ‌تر است، چون روی محور راست‌تر قرار دارد.`
      : `${faNumber(b)} از ${faNumber(a)} بزرگ‌تر است، چون روی محور راست‌تر قرار دارد.`,
    signature:`greater-mix-${Math.min(a,b)}-${Math.max(a,b)}`
  };
}

function genBetween(){
  const left=randInt(-8,4);
  const gap=randInt(2,5);
  const right=Math.min(9,left+gap);

  const valid=randInt(left+1,right-1);

  const wrongPool=[
    left,
    right,
    left-1,
    right+1,
    right+2
  ];

  const choices=shuffle([
    valid,
    ...shuffle(wrongPool.filter(x=>x>=-10 && x<=10)).slice(0,3)
  ]);

  return {
    type:"between",
    level:2,
    min:-10,
    max:10,
    left,
    right,
    choices,
    prompt:`عددی را انتخاب کن که بین ${faNumber(left)} و ${faNumber(right)} باشد.`,
    hint:"خودِ دو مرز پاسخ نیستند.",
    explanation:`پاسخ باید از ${faNumber(left)} بزرگ‌تر و از ${faNumber(right)} کوچک‌تر باشد.`,
    signature:`between-${left}-${right}-${valid}`
  };
}

function genDistanceFromZero(){
  const distance=randInt(2,8);

  const choices=shuffle([
    -distance,
    distance,
    Math.max(-10,-distance-1),
    Math.min(10,distance+1)
  ]);

  return {
    type:"twoPositions",
    level:2,
    min:-10,
    max:10,
    targets:[-distance,distance],
    choices,
    required:2,
    prompt:`دو عدد صحیحی را پیدا کن که فاصله هرکدام از صفر ${faNumber(distance)} واحد باشد.`,
    hint:"در دو طرف صفر، دو جایگاه با فاصله برابر وجود دارد.",
    explanation:`${faNumber(-distance)} و ${faNumber(distance)} هر دو ${faNumber(distance)} واحد با صفر فاصله دارند و قرینه یکدیگرند.`,
    signature:`distance-${distance}`
  };
}

function genOrderFour(){
  const values=uniqueIntegers(4,-9,9);

  return {
    type:"order",
    level:3,
    min:-10,
    max:10,
    items:shuffle(values),
    prompt:"واگن‌ها را از کوچک به بزرگ بچین.",
    hint:"چیدن از کوچک به بزرگ یعنی حرکت از چپ به راست روی محور.",
    explanation:"در محور اعداد، هرچه به سمت راست حرکت کنیم مقدار عدد بزرگ‌تر می‌شود.",
    signature:`order4-${[...values].sort((a,b)=>a-b).join("_")}`
  };
}

function genOrderNegatives(){
  const values=uniqueIntegers(4,-9,-1);

  return {
    type:"order",
    level:3,
    min:-10,
    max:1,
    items:shuffle(values),
    prompt:"فقط عددهای منفی‌اند؛ واگن‌ها را از کوچک به بزرگ مرتب کن.",
    hint:"در منفی‌ها، عددی با قدرمطلق بزرگ‌تر معمولاً چپ‌تر و کوچک‌تر است.",
    explanation:"برای عددهای منفی هم قانون محور تغییر نمی‌کند: چپ‌تر کوچک‌تر و راست‌تر بزرگ‌تر است.",
    signature:`order-neg-${[...values].sort((a,b)=>a-b).join("_")}`
  };
}

function genMissingPosition(){
  const left=randInt(-8,5);
  const right=left+2;
  const target=left+1;

  return {
    type:"locate",
    level:3,
    min:-10,
    max:10,
    target,
    markerValues:[left,right],
    prompt:`ایستگاه گمشده بین ${faNumber(left)} و ${faNumber(right)} را پیدا کن.`,
    hint:"عددهای صحیح متوالی روی محور یک واحد با هم فاصله دارند.",
    explanation:`تنها عدد صحیح میان ${faNumber(left)} و ${faNumber(right)} برابر ${faNumber(target)} است.`,
    signature:`missing-${left}-${right}`
  };
}

function genOppositeOfOpposite(){
  let source=randInt(-9,9);

  return {
    type:"locate",
    level:3,
    min:-10,
    max:10,
    target:source,
    prompt:`اول قرینه ${faNumber(source)} را تصور کن؛ حالا قرینه آن را روی ریل پیدا کن.`,
    hint:"دو بار قرینه‌کردن، عدد را به جای اولش برمی‌گرداند.",
    explanation:`قرینه قرینه هر عدد خودِ آن عدد است؛ بنابراین پاسخ ${faNumber(source)} است.`,
    signature:`double-opposite-${source}`
  };
}

function genGreatestNegative(){
  return {
    type:"chooseGreater",
    level:3,
    min:-7,
    max:2,
    a:-1,
    b:-randInt(2,7),
    choices:shuffle([-1,-randInt(2,7),0,1]),
    special:"greatestNegative",
    prompt:"بزرگ‌ترین عدد صحیح منفی را پیدا کن.",
    hint:"دنبال عدد منفی‌ای بگرد که از همه به صفر نزدیک‌تر است.",
    explanation:"−۱ بزرگ‌ترین عدد صحیح منفی است؛ چون نزدیک‌ترین عدد صحیح منفی به صفر است.",
    signature:`greatest-negative-${randInt(1,999999)}`
  };
}

/*
  بیش از ۱۰ خانواده/زیرخانواده وجود دارد.
  هر دور دقیقاً ۱۰ مأموریت انتخاب می‌شود.
*/

const generatorPlan=[
  genLocatePositive,
  genLocateNegative,
  genOpposite,
  genCompareNegative,
  genCompareMixed,
  genBetween,
  genDistanceFromZero,
  ()=>pick([genOrderFour,genOrderNegatives])(),
  ()=>pick([genMissingPosition,genOppositeOfOpposite])(),
  ()=>pick([genOrderNegatives,genOrderFour,genGreatestNegative])()
];

function generateRound(){
  const result=[];

  for(const generator of generatorPlan){
    let selected=null;

    for(let attempt=0;attempt<35;attempt++){
      const candidate=generator();

      if(
        !recentSignatures.includes(candidate.signature) &&
        !result.some(q=>q.signature===candidate.signature)
      ){
        selected=candidate;
        break;
      }
    }

    if(!selected){
      for(let attempt=0;attempt<20;attempt++){
        const candidate=generator();

        if(!result.some(q=>q.signature===candidate.signature)){
          selected=candidate;
          break;
        }
      }
    }

    result.push(selected || generator());
  }

  saveRecentSignatures(result);
  return result;
}

/* =========================================================
   UI / RENDERING
   ========================================================= */

function resetInteractionState(){
  interactionState={
    selectedPosition:null,
    selectedCardIndexes:[],
    order:[]
  };
}

function setLevel(level){
  const badge=$("levelBadge");

  if(level===1){
    badge.className="level";
    badge.textContent="🟢 پایه";
  }else if(level===2){
    badge.className="level master";
    badge.textContent="🟡 تسلط";
  }else{
    badge.className="level challenge";
    badge.textContent="🔴 چالش";
  }
}

function positionPercent(q,value){
  return ((value-q.min)/(q.max-q.min))*100;
}

function renderQuestion(){
  stopTimer();

  answerChecked=false;
  resetInteractionState();

  const q=questions[currentIndex];

  $("missionStatus").textContent=
    `${faNumber(currentIndex+1)} از ${faNumber(TOTAL_QUESTIONS)}`;

  $("scoreStatus").textContent=
    `${faNumber(score)} از ${faNumber(100)}`;

  setLevel(q.level);

  $("prompt").textContent=q.prompt;
  $("hint").textContent=q.hint;

  $("feedback").className="feedback";
  $("feedback").innerHTML="";

  $("cards").innerHTML="";
  $("orderZone").innerHTML="";
  $("orderZone").hidden=true;

  $("checkBtn").hidden=false;
  $("checkBtn").disabled=false;

  $("nextBtn").hidden=true;

  $("clearBtn").hidden=false;
  $("clearBtn").disabled=false;

  renderAxis(q);

  if(
    q.type==="chooseGreater" ||
    q.type==="between" ||
    q.type==="twoPositions"
  ){
    renderCards(q);
  }

  if(q.type==="order"){
    renderOrder(q);
  }

  startTimer();
}

function renderAxis(q){
  const axis=$("axis");
  axis.innerHTML="";

  for(let value=q.min;value<=q.max;value++){
    const tick=document.createElement("div");
    tick.className="tick"+(value===0?" zero":"");
    tick.style.left=positionPercent(q,value)+"%";

    const label=document.createElement("span");
    label.className="tick-label";

    /*
      برای محورهای متراکم، برچسب‌های کافی نمایش داده می‌شوند
      ولی تمام نقاط همچنان قابل لمس‌اند.
    */
    const range=q.max-q.min;
    const shouldLabel=
      range<=12 ||
      value===0 ||
      value===q.min ||
      value===q.max ||
      value%2===0;

    if(shouldLabel){
      label.textContent=faNumber(value);
      tick.appendChild(label);
    }

    if(q.type==="locate"){
      const hit=document.createElement("button");
      hit.type="button";
      hit.className="tick-btn";
      hit.setAttribute("aria-label",`عدد ${value}`);

      hit.addEventListener("click",()=>{
        selectAxisPosition(value);
      });

      tick.appendChild(hit);
    }

    axis.appendChild(tick);
  }

  if(q.type==="locate"){
    const train=document.createElement("div");
    train.id="train";
    train.className="train";
    train.textContent="🚂";
    train.style.left=positionPercent(q,0)+"%";
    axis.appendChild(train);
  }

  if(Array.isArray(q.markerValues)){
    q.markerValues.forEach(value=>{
      addMarker(q,value,faNumber(value));
    });
  }

  if(q.type==="chooseGreater"){
    addMarker(q,q.a,faNumber(q.a));
    addMarker(q,q.b,faNumber(q.b));
  }

  if(q.type==="between"){
    const lo=Math.min(q.left,q.right);
    const hi=Math.max(q.left,q.right);

    const range=document.createElement("div");
    range.className="range";
    range.style.left=positionPercent(q,lo)+"%";
    range.style.width=
      (positionPercent(q,hi)-positionPercent(q,lo))+"%";

    axis.appendChild(range);

    addMarker(q,q.left,faNumber(q.left));
    addMarker(q,q.right,faNumber(q.right));
  }

  if(q.type==="twoPositions"){
    addMarker(q,0,"۰");
  }
}

function addMarker(q,value,labelText){
  if(value<q.min || value>q.max)return;

  const axis=$("axis");

  const marker=document.createElement("div");
  marker.className="marker";
  marker.style.left=positionPercent(q,value)+"%";

  const label=document.createElement("div");
  label.className="marker-label";
  label.style.left=positionPercent(q,value)+"%";
  label.textContent=labelText;

  axis.appendChild(marker);
  axis.appendChild(label);
}

function selectAxisPosition(value){
  if(answerChecked || gameFinished)return;

  const q=questions[currentIndex];

  interactionState.selectedPosition=value;

  let dot=$("selectedDot");

  if(!dot){
    dot=document.createElement("div");
    dot.id="selectedDot";
    dot.className="selected-dot";
    $("axis").appendChild(dot);
  }

  dot.style.left=positionPercent(q,value)+"%";

  const train=$("train");

  if(train){
    train.style.left=positionPercent(q,value)+"%";
  }
}

function renderCards(q){
  q.choices.forEach((value,index)=>{
    const button=document.createElement("button");

    button.type="button";
    button.className="num-card";
    button.textContent=faNumber(value);

    button.addEventListener("click",()=>{
      if(answerChecked || gameFinished)return;

      if(q.type==="twoPositions"){
        toggleMultiCard(button,index,q.required);
      }else{
        interactionState.selectedCardIndexes=[index];

        [...$("cards").children].forEach(
          card=>card.classList.remove("selected")
        );

        button.classList.add("selected");
      }
    });

    $("cards").appendChild(button);
  });
}

function toggleMultiCard(button,index,required){
  const position=
    interactionState.selectedCardIndexes.indexOf(index);

  if(position>=0){
    interactionState.selectedCardIndexes.splice(position,1);
    button.classList.remove("selected");
    return;
  }

  if(interactionState.selectedCardIndexes.length>=required){
    const oldIndex=interactionState.selectedCardIndexes.shift();
    const oldButton=$("cards").children[oldIndex];

    if(oldButton){
      oldButton.classList.remove("selected");
    }
  }

  interactionState.selectedCardIndexes.push(index);
  button.classList.add("selected");
}

function renderOrder(q){
  const zone=$("orderZone");

  zone.hidden=false;

  q.items.forEach((value,index)=>{
    const button=document.createElement("button");

    button.type="button";
    button.className="num-card";
    button.textContent=faNumber(value);
    button.dataset.index=String(index);

    button.addEventListener("click",()=>{
      if(
        answerChecked ||
        button.classList.contains("used")
      )return;

      interactionState.order.push(index);
      button.classList.add("used");

      renderOrderZone(q);
    });

    $("cards").appendChild(button);
  });

  renderOrderZone(q);
}

function renderOrderZone(q){
  const zone=$("orderZone");
  zone.innerHTML="";

  if(interactionState.order.length===0){
    const empty=document.createElement("span");
    empty.className="empty-text";
    empty.textContent="اول کوچک‌ترین واگن را لمس کن...";
    zone.appendChild(empty);
    return;
  }

  interactionState.order.forEach((itemIndex,position)=>{
    const chip=document.createElement("button");

    chip.type="button";
    chip.className="order-chip";
    chip.textContent=`${faNumber(q.items[itemIndex])} ×`;

    chip.addEventListener("click",()=>{
      if(answerChecked)return;

      interactionState.order.splice(position,1);

      [...$("cards").children].forEach(
        button=>button.classList.remove("used")
      );

      interactionState.order.forEach(index=>{
        const button=
          $("cards").querySelector(`[data-index="${index}"]`);

        if(button){
          button.classList.add("used");
        }
      });

      renderOrderZone(q);
    });

    zone.appendChild(chip);
  });
}

$("clearBtn").addEventListener("click",()=>{
  if(answerChecked || gameFinished)return;

  const q=questions[currentIndex];

  resetInteractionState();

  if(q.type==="locate"){
    const dot=$("selectedDot");

    if(dot){
      dot.remove();
    }

    const train=$("train");

    if(train){
      train.style.left=positionPercent(q,0)+"%";
    }
  }

  [...$("cards").children].forEach(button=>{
    button.classList.remove("selected","used");
  });

  if(q.type==="order"){
    renderOrderZone(q);
  }
});

/* =========================================================
   EVALUATION
   ========================================================= */

function evaluate(q){
  if(q.type==="locate"){
    if(interactionState.selectedPosition===null){
      return {ready:false,correct:false};
    }

    return {
      ready:true,
      correct:interactionState.selectedPosition===q.target
    };
  }

  if(q.type==="chooseGreater"){
    if(interactionState.selectedCardIndexes.length!==1){
      return {ready:false,correct:false};
    }

    const index=interactionState.selectedCardIndexes[0];
    const selected=q.choices[index];

    if(q.special==="greatestNegative"){
      return {
        ready:true,
        correct:selected===-1
      };
    }

    return {
      ready:true,
      correct:selected===Math.max(q.a,q.b)
    };
  }

  if(q.type==="between"){
    if(interactionState.selectedCardIndexes.length!==1){
      return {ready:false,correct:false};
    }

    const index=interactionState.selectedCardIndexes[0];
    const selected=q.choices[index];

    const lo=Math.min(q.left,q.right);
    const hi=Math.max(q.left,q.right);

    return {
      ready:true,
      correct:selected>lo && selected<hi
    };
  }

  if(q.type==="twoPositions"){
    if(interactionState.selectedCardIndexes.length!==q.required){
      return {ready:false,correct:false};
    }

    const selected=
      interactionState.selectedCardIndexes
        .map(index=>q.choices[index])
        .sort((a,b)=>a-b);

    const expected=[...q.targets].sort((a,b)=>a-b);

    return {
      ready:true,
      correct:
        selected.length===expected.length &&
        selected.every((value,index)=>value===expected[index])
    };
  }

  if(q.type==="order"){
    if(interactionState.order.length!==q.items.length){
      return {ready:false,correct:false};
    }

    const values=
      interactionState.order.map(index=>q.items[index]);

    for(let i=1;i<values.length;i++){
      if(values[i]<values[i-1]){
        return {ready:true,correct:false};
      }
    }

    return {ready:true,correct:true};
  }

  return {ready:false,correct:false};
}

function correctAnswerText(q){
  if(q.type==="locate"){
    return `جای درست: ${faNumber(q.target)}`;
  }

  if(q.type==="chooseGreater"){
    if(q.special==="greatestNegative"){
      return "پاسخ درست: −۱";
    }

    return `عدد بزرگ‌تر: ${faNumber(Math.max(q.a,q.b))}`;
  }

  if(q.type==="between"){
    const lo=Math.min(q.left,q.right);
    const hi=Math.max(q.left,q.right);

    const valid=q.choices.filter(
      value=>value>lo && value<hi
    );

    return `پاسخ معتبر: ${valid.map(faNumber).join(" ، ")}`;
  }

  if(q.type==="twoPositions"){
    return `دو پاسخ درست: ${q.targets.map(faNumber).join(" و ")}`;
  }

  if(q.type==="order"){
    return `ترتیب درست: ${[...q.items]
      .sort((a,b)=>a-b)
      .map(faNumber)
      .join(" < ")}`;
  }

  return "";
}

function revealCorrect(q){
  if(q.type!=="locate")return;

  const train=$("train");

  if(train){
    train.style.left=
      positionPercent(q,q.target)+"%";
  }

  addMarker(q,q.target,faNumber(q.target));
}

function scoreForElapsed(milliseconds){
  const seconds=milliseconds/1000;

  if(seconds<=5)return 10;
  if(seconds<=10)return 8;
  if(seconds<=15)return 6;
  if(seconds<=20)return 4;
  if(seconds<=30)return 2;

  return 0;
}

function lockInteraction(){
  $("checkBtn").disabled=true;
  $("clearBtn").disabled=true;

  [...document.querySelectorAll(
    "#cards button,#orderZone button,#axis button"
  )].forEach(button=>{
    button.disabled=true;
  });
}

function showFeedback(kind,title,text){
  const box=$("feedback");

  box.className=`feedback show ${kind}`;
  box.innerHTML=`<strong>${title}</strong>${text}`;
}

function animateGameCard(className){
  const card=$("gameCard");

  card.classList.remove(className);
  void card.offsetWidth;
  card.classList.add(className);

  setTimeout(()=>{
    card.classList.remove(className);
  },350);
}

function checkAnswer(){
  if(answerChecked || gameFinished)return;

  const now=Date.now();

  if(now>=questionDeadline){
    handleTimeout();
    return;
  }

  const q=questions[currentIndex];
  const result=evaluate(q);

  if(!result.ready){
    showFeedback(
      "timeout",
      "پاسخ هنوز کامل نیست.",
      q.type==="order"
        ? "همه واگن‌ها را بچین و بعد پاسخ را ثبت کن."
        : q.type==="twoPositions"
        ? `باید ${faNumber(q.required)} عدد را انتخاب کنی.`
        : "اول یک جایگاه یا کارت را انتخاب کن."
    );

    return;
  }

  answerChecked=true;
  stopTimer();
  lockInteraction();

  if(result.correct){
    const gained=
      scoreForElapsed(now-questionStartedAt);

    score=Math.min(100,score+gained);

    $("scoreStatus").textContent=
      `${faNumber(score)} از ${faNumber(100)}`;

    showFeedback(
      "good",
      `✅ آفرین! +${faNumber(gained)} امتیاز`,
      q.explanation
    );

    animateGameCard("pop");
  }else{
    showFeedback(
      "bad",
      "❌ این پاسخ با جای عدد روی محور سازگار نیست.",
      `${correctAnswerText(q)}<br>${q.explanation}`
    );

    revealCorrect(q);
    animateGameCard("shake");
  }

  $("checkBtn").hidden=true;
  $("nextBtn").hidden=false;

  $("nextBtn").textContent=
    currentIndex===TOTAL_QUESTIONS-1
      ? "دیدن نتیجه 🏁"
      : "مأموریت بعدی";
}

$("checkBtn").addEventListener("click",checkAnswer);

function handleTimeout(){
  if(answerChecked || gameFinished)return;

  answerChecked=true;
  stopTimer();
  lockInteraction();

  const q=questions[currentIndex];

  showFeedback(
    "timeout",
    "⏰ زمان تمام شد.",
    `${correctAnswerText(q)}<br>${q.explanation}`
  );

  revealCorrect(q);

  $("checkBtn").hidden=true;
  $("nextBtn").hidden=false;

  $("nextBtn").textContent=
    currentIndex===TOTAL_QUESTIONS-1
      ? "دیدن نتیجه 🏁"
      : "مأموریت بعدی";
}

/* =========================================================
   TIMER
   ========================================================= */

function startTimer(){
  stopTimer();

  questionStartedAt=Date.now();
  questionDeadline=
    questionStartedAt+(QUESTION_TIME*1000);

  updateTimerUI();

  timerInterval=setInterval(
    updateTimerUI,
    100
  );
}

function updateTimerUI(){
  if(answerChecked || gameFinished)return;

  const remaining=
    Math.max(0,questionDeadline-Date.now());

  const ratio=
    remaining/(QUESTION_TIME*1000);

  $("timeText").textContent=
    `${faNumber(Math.ceil(remaining/1000))} ثانیه`;

  $("timerFill").style.width=
    `${Math.max(0,Math.min(100,ratio*100))}%`;

  $("timerFill").style.background=
    ratio>.5
      ? "#51dd91"
      : ratio>.2
      ? "#f4c542"
      : "#e55161";

  if(remaining<=0){
    handleTimeout();
  }
}

function stopTimer(){
  if(timerInterval!==null){
    clearInterval(timerInterval);
    timerInterval=null;
  }
}

/* =========================================================
   GAME FLOW
   ========================================================= */

$("nextBtn").addEventListener("click",()=>{
  if(!answerChecked || gameFinished)return;

  if(currentIndex>=TOTAL_QUESTIONS-1){
    finishGame();
    return;
  }

  currentIndex++;
  renderQuestion();
});

async function finishGame(){
  if(gameFinished)return;

  gameFinished=true;
  stopTimer();

  $("playArea").style.display="none";
  $("resultArea").classList.add("show");

  $("finalScore").textContent=faNumber(score);

  $("resultName").textContent=
    `${player.playerName || "بازیکن"}، امتیاز نهایی تو:`;

  $("resultMessage").textContent=
    score>=90
      ? "عالی! جای عددهای صحیح، قرینه و ترتیب آن‌ها را خیلی خوب می‌بینی. 🌟"
      : score>=70
      ? "خیلی خوب! روی مقایسه عددهای منفی کمی بیشتر تمرین کن تا ریل کاملاً دستت بیاید. 🚂"
      : score>=50
      ? "اصل محور را می‌دانی؛ هنگام مقایسه منفی‌ها همیشه به «راست‌تر = بزرگ‌تر» برگرد. 📍"
      : "یک دور دیگر بازی کن و هر عدد را قبل از پاسخ، در ذهن روی محور قرار بده. 🧭";

  if(!finishSubmitted){
    finishSubmitted=true;

    try{
      await GameSDK.finishGame(score);
    }catch(error){
      console.error("finishGame failed",error);
    }
  }

  await loadLeaderboard();
}

async function loadLeaderboard(){
  const container=$("leaderRows");

  container.innerHTML=
    '<div style="text-align:center;color:#707890">در حال دریافت...</div>';

  try{
    const scores=
      await GameSDK.getLeaderboard(10);

    if(!scores || !scores.length){
      container.innerHTML=
        '<div style="text-align:center;color:#707890">هنوز رکوردی ثبت نشده است.</div>';

      return;
    }

    container.innerHTML="";

    scores.forEach((entry,index)=>{
      const row=document.createElement("div");
      row.className="leader-row";

      const rank=
        index===0
        ? "🥇"
        : index===1
        ? "🥈"
        : index===2
        ? "🥉"
        : `${faNumber(index+1)}.`;

      const name=
        entry.playerName ??
        entry.name ??
        "بازیکن";

      const points=
        entry.score ?? 0;

      const left=document.createElement("span");
      left.textContent=`${rank} ${name}`;

      const right=document.createElement("strong");
      right.textContent=
        `${faNumber(points)} امتیاز`;

      row.append(left,right);
      container.appendChild(row);
    });

  }catch(error){
    console.error(
      "leaderboard failed",
      error
    );

    container.innerHTML=
      '<div class="error">جدول برترین‌ها فعلاً قابل دریافت نیست.</div>';
  }
}

$("restartBtn").addEventListener("click",()=>{
  stopTimer();

  try{
    GameSDK.reset();
  }catch(error){
    console.error("reset failed",error);
  }

  score=0;
  currentIndex=0;

  answerChecked=false;
  gameFinished=false;
  finishSubmitted=false;

  interactionState={};

  $("scoreStatus").textContent=
    `${faNumber(0)} از ${faNumber(100)}`;

  $("playArea").style.display="";
  $("resultArea").classList.remove("show");

  questions=generateRound();

  renderQuestion();
});

/* =========================================================
   INIT
   ========================================================= */

function init(){
  questions=generateRound();

  if(questions.length!==TOTAL_QUESTIONS){
    throw new Error(
      "Exactly 10 missions are required."
    );
  }

  renderQuestion();
}

init();

</script>
