<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>بازی ریاضی</title>

    <style>

        body {
            font-family: Tahoma, sans-serif;
            margin: 0;
            background: #f5f7fb;
            text-align: center;
            color: #1f2937;
        }

        .game {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #leaderboard {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 16px;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #f8fafc;
            border-radius: 10px;
        }

        .leaderboard-player {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .leaderboard-score {
            font-weight: bold;
            color: #2563eb;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <main class="game">

        <h1>
            🎮 نام بازی
        </h1>

        <p id="playerName">
        </p>


        <div id="gameArea">

            <!--
                منطق و ظاهر بازی جدید
                در این قسمت قرار می‌گیرد
            -->

        </div>


        <p id="score">
            امتیاز: 80
        </p>


        <button
            id="finishBtn"
            type="button">

            پایان بازی

        </button>


        <div id="leaderboard">

            <h2>
                🏆 برترین‌های این بازی
            </h2>

            <div id="leaderboardList">

                در حال دریافت...

            </div>

        </div>


        <a
            href="/#game"
            class="back-link">

            ← بازگشت به بازی‌ها

        </a>

    </main>


    <script src="/games/game-sdk.js"></script>


    <script>

        /*
         * برای هر بازی این ID
         * باید مطابق contents باشد.
         */
        const GAME_ID = 1;


        const player =
            GameSDK.init(GAME_ID);


        document
            .getElementById(
                "playerName"
            )
            .textContent =
            `بازیکن: ${player.playerName}`;


        /*
         * فعلاً برای تست 80 است.
         * در بازی واقعی محاسبه می‌شود.
         */
        let score = 80;


        document
            .getElementById(
                "finishBtn"
            )
            .addEventListener(
                "click",
                finishGame
            );


        async function finishGame() {

            const button =
                document.getElementById(
                    "finishBtn"
                );


            button.disabled = true;

            button.textContent =
                "در حال ثبت امتیاز...";


            const result =
                await GameSDK.finishGame(
                    score
                );


            if (result?.success) {

                button.textContent =
                    "امتیاز ثبت شد ✅";


                await showLeaderboard();

                return;
            }


            button.disabled = false;

            button.textContent =
                "تلاش مجدد";


            alert(
                result?.message ||
                "ثبت امتیاز انجام نشد."
            );
        }


        async function showLeaderboard() {

            const scores =
                await GameSDK
                    .getLeaderboard(10);


            const list =
                document.getElementById(
                    "leaderboardList"
                );


            if (!scores.length) {

                list.innerHTML =
                    "هنوز امتیازی ثبت نشده است.";

                return;
            }


            list.innerHTML =
                scores
                    .map(
                        (item, index) => {

                            let rank;


                            if (index === 0) {

                                rank = "🥇";

                            } else if (
                                index === 1
                            ) {

                                rank = "🥈";

                            } else if (
                                index === 2
                            ) {

                                rank = "🥉";

                            } else {

                                rank =
                                    `${index + 1}.`;
                            }


                            return `

                                <div
                                    class="leaderboard-row">

                                    <div
                                        class="leaderboard-player">

                                        <span>
                                            ${rank}
                                        </span>

                                        <span>
                                            ${escapeHtml(
                                                item.player_name
                                            )}
                                        </span>

                                    </div>

                                    <span
                                        class="leaderboard-score">

                                        ${item.score}

                                    </span>

                                </div>

                            `;
                        }
                    )
                    .join("");
        }


        function escapeHtml(value) {

            return String(value ?? "")
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );
        }


        /*
         * جدول برترین‌ها هنگام
         * ورود به بازی هم نمایش داده شود.
         */
        showLeaderboard();

    </script>

</body>

</html>
