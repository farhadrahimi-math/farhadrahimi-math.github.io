<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کارخانه علامت‌ها ⚙️🤖 | ریاضی هشتم</title>
<style>
:root{
 --purple:#7456d8;--blue:#3e83ed;--pink:#ec70a7;--yellow:#f5c543;
 --green:#29ad78;--red:#e65362;--ink:#29334b;--muted:#6d7690;
 --shadow:0 10px 28px rgba(58,51,108,.12)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
 font-family:Tahoma,Arial,sans-serif;color:var(--ink);line-height:1.65;
 background:
 radial-gradient(circle at 10% 5%,#e7e2ff 0,transparent 27%),
 radial-gradient(circle at 91% 12%,#dcf4ff 0,transparent 26%),
 #f7f7fc
}
button{font:inherit}
button:focus-visible{outline:3px solid #277ee8;outline-offset:3px}
.app{width:min(100%,920px);margin:auto;padding:14px 12px 30px}

.header{
 background:linear-gradient(135deg,#7353d6,#4086eb);
 color:white;border-radius:22px;padding:16px;box-shadow:var(--shadow)
}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{
 padding:3px 9px;border-radius:99px;font-size:11px;font-weight:bold;
 background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.26)
}
h1{font-size:clamp(23px,6vw,34px);margin:8px 0 2px}
.subtitle{margin:0;color:#f2efff;font-size:13px}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.status-card{min-width:0;background:white;color:var(--ink);border-radius:13px;text-align:center;padding:6px 3px}
.status-card small{display:block;color:var(--muted);font-size:10px}
.status-card strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-box{margin-top:9px;padding:7px;border-radius:13px;background:rgba(255,255,255,.15)}
.timer-head{display:flex;justify-content:space-between;font-size:12px}
.timer-track{height:9px;margin-top:5px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.timer-fill{height:100%;width:100%;border-radius:inherit;background:#51dd91;transition:width .15s linear,background-color .2s}

.game-card{margin-top:13px;background:#fff;border-radius:22px;padding:15px;box-shadow:var(--shadow);min-height:490px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.level{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:bold;background:#e9f8ef;color:#18794d}
.level.master{background:#fff3ca;color:#916600}.level.challenge{background:#ffe9ee;color:#bc3850}
.prompt{text-align:center;font-weight:bold;font-size:clamp(16px,4.5vw,20px);margin:15px auto 4px}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px}

.factory{
 max-width:730px;margin:auto;border:1px solid #d9deed;border-radius:20px;
 padding:15px 10px;background:linear-gradient(135deg,#f7f5ff,#f1faff);
 position:relative;overflow:hidden
}
.factory::after{
 content:"⚙️";position:absolute;left:-10px;bottom:-25px;font-size:100px;
 opacity:.045;transform:rotate(15deg);pointer-events:none
}
.expression{
 direction:ltr;unicode-bidi:isolate;text-align:center;
 font-weight:bold;font-size:clamp(20px,6vw,29px);
 margin:3px auto 15px;overflow-wrap:anywhere
}
.belt{
 direction:ltr;display:flex;justify-content:center;align-items:center;
 flex-wrap:wrap;gap:7px;padding:11px;border-radius:15px;
 background:#fff;border:2px dashed #cfd6e5;min-height:86px
}
.factor{
 min-width:54px;min-height:52px;border:2px solid #dad9e8;
 background:white;border-radius:13px;font-weight:bold;font-size:17px;
 color:#344057;cursor:pointer;padding:6px 9px
}
.factor.negative{border-color:#efb3bc;background:#fff2f4;color:#b63249}
.factor.positive{border-color:#aed7f7;background:#eff8ff;color:#256da9}
.factor.selected{box-shadow:0 0 0 4px #f5c543;transform:translateY(-2px)}
.factor.paired{opacity:.35;text-decoration:line-through}
.factor:disabled{cursor:not-allowed}

.pair-info{
 text-align:center;min-height:28px;margin-top:10px;
 color:#59647b;font-size:13px
}
.gears{
 display:flex;justify-content:center;align-items:center;gap:8px;
 margin:12px auto 5px;direction:ltr;flex-wrap:wrap
}
.gear{
 width:66px;height:66px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:#edf2fa;border:4px dashed #8c96a9;
 font-size:27px;font-weight:bold;color:#576276
}
.gear.pos{background:#e9f8ef;border-color:#57b583;color:#19764b}
.gear.neg{background:#ffebee;border-color:#e26170;color:#ac2d44}
.arrow{font-size:22px;color:#8a829e}
.output-title{text-align:center;font-size:12px;color:#6e7790}

.sign-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:12px auto 0}
.sign-btn{
 min-height:54px;border:2px solid #dad9e9;border-radius:14px;
 background:white;font-size:17px;font-weight:bold;color:#3d465d;cursor:pointer
}
.sign-btn.positive.selected{background:#e8f8ef;border-color:#45af77;color:#177348}
.sign-btn.negative.selected{background:#ffebee;border-color:#e15566;color:#af2b43}

.action-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{min-height:48px;border:0;border-radius:14px;padding:9px 18px;font-weight:bold;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#7556d7,#4283e9);color:#fff}
.btn-secondary{background:#edf0f6;color:#3e485e}
.btn:disabled,.sign-btn:disabled{opacity:.45;cursor:not-allowed}

.feedback{display:none;margin-top:13px;padding:11px 13px;border-radius:14px;font-size:14px}
.feedback.show{display:block}
.feedback.good{background:#e8f8ef;border:1px solid #a8ddbf;color:#176b43}
.feedback.bad{background:#ffebee;border:1px solid #efb4bd;color:#a52b40}
.feedback.timeout{background:#fff3da;border:1px solid #e9ca84;color:#835c00}
.feedback strong{display:block}

.result{display:none;text-align:center}.result.show{display:block}
.score-circle{
 width:128px;height:128px;border-radius:50%;margin:17px auto;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#e7e1ff,#daf3ff);
 border:7px solid white;box-shadow:0 0 0 3px #7456d8
}
.score-circle strong{font-size:35px;color:#6544cf}.score-circle small{color:#667}
.leaderboard{max-width:530px;margin:18px auto;background:#f8f8fc;border-radius:16px;padding:10px;text-align:right}
.leader-row{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid #e2e2ec}
.leader-row:last-child{border-bottom:0}.error{color:#a72e43;text-align:center;font-size:12px}
.back{display:block;text-align:center;margin:17px auto;color:#604bbc;font-weight:bold;text-decoration:none}
.pop{animation:pop .28s ease}.shake{animation:shake .28s ease}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(4px)}50%{transform:translateX(-4px)}75%{transform:translateX(3px)}}
@media(min-width:650px){.app{padding:22px 18px 40px}.header{padding:20px}.game-card{padding:22px}}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<main class="app">
<header class="header">
 <div class="badges"><span class="badge">پایه هشتم</span><span class="badge">فصل ۱</span><span class="badge">درس ۱</span></div>
 <h1>کارخانه علامت‌ها ⚙️🤖</h1>
 <p class="subtitle">قبل از محاسبه، علامت خروجی موتور را پیش‌بینی کن.</p>

 <div class="status">
  <div class="status-card"><small>بازیکن</small><strong id="playerName">...</strong></div>
  <div class="status-card"><small>مأموریت</small><strong id="missionStatus">۱ از ۱۰</strong></div>
  <div class="status-card"><small>امتیاز</small><strong id="scoreStatus">۰ از ۱۰۰</strong></div>
 </div>

 <div class="timer-box">
  <div class="timer-head"><span>⏱ زمان باقی‌مانده</span><strong id="timeText">۳۰ ثانیه</strong></div>
  <div class="timer-track"><div id="timerFill" class="timer-fill"></div></div>
 </div>
</header>

<section id="gameCard" class="game-card">
 <div id="playArea">
  <div class="topline">
   <span id="levelBadge" class="level">🟢 پایه</span>
   <span style="font-size:12px;color:#707890">هدف: علامت، نه حاصل دقیق</span>
  </div>

  <div id="prompt" class="prompt"></div>
  <div id="hint" class="hint"></div>

  <div class="factory">
   <div id="expression" class="expression"></div>
   <div id="belt" class="belt"></div>
   <div id="pairInfo" class="pair-info"></div>

   <div class="gears">
    <div id="negativeGear" class="gear">−</div>
    <div class="arrow">⚙️ →</div>
    <div id="outputGear" class="gear">؟</div>
   </div>
   <div class="output-title">خروجی موتور</div>

   <div class="sign-controls">
    <button id="positiveBtn" class="sign-btn positive" type="button">➕ مثبت</button>
    <button id="negativeBtn" class="sign-btn negative" type="button">➖ منفی</button>
   </div>
  </div>

  <div class="action-row">
   <button id="resetBtn" class="btn btn-secondary" type="button">↩ بازنشانی</button>
   <button id="checkBtn" class="btn btn-primary" type="button">روشن کردن موتور ⚙️</button>
   <button id="nextBtn" class="btn btn-primary" type="button" hidden>مأموریت بعدی</button>
  </div>

  <div id="feedback" class="feedback" aria-live="polite"></div>
 </div>

 <div id="resultArea" class="result">
  <div style="font-size:48px">⚙️🏆</div>
  <h2>خط تولید کامل شد!</h2>
  <p id="resultName"></p>
  <div class="score-circle"><strong id="finalScore">۰</strong><small>از ۱۰۰</small></div>
  <p id="resultMessage"></p>
  <button id="restartBtn" class="btn btn-primary" type="button">🔄 بازی دوباره</button>

  <div class="leaderboard">
   <h3 style="text-align:center;margin:5px">🏆 مهندس‌های برتر</h3>
   <div id="leaderRows"></div>
  </div>
 </div>
</section>

<a class="back" href="/#game">← بازگشت به بازی‌های ریاضی</a>
</main>

<script src="/games/game-sdk.js"></script>
<script>
"use strict";

const GAME_ID = 10;
const player = GameSDK.init(GAME_ID);

const TOTAL_QUESTIONS = 10;
const QUESTION_TIME = 30;
const RECENT_KEY = "grade8Lesson1SignFactoryRecent";
const MAX_RECENT_SIGNATURES = 40;

let questions=[];
let currentIndex=0;
let score=0;
let answerChecked=false;
let gameFinished=false;
let finishSubmitted=false;
let timerInterval=null;
let questionStartedAt=0;
let questionDeadline=0;
let interactionState={};
let recentSignatures=loadRecent();

const $=id=>document.getElementById(id);
$("playerName").textContent=player.playerName || "بازیکن";

function faNumber(v){
 return String(v).replace(/-/g,"−").replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}
function signed(v){return v>0?`+${faNumber(v)}`:faNumber(v)}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

function loadRecent(){
 try{
  const x=JSON.parse(localStorage.getItem(RECENT_KEY)||"[]");
  return Array.isArray(x)?x.slice(-MAX_RECENT_SIGNATURES):[];
 }catch(e){return[]}
}
function saveRecent(qs){
 recentSignatures=[...recentSignatures,...qs.map(q=>q.signature)].slice(-MAX_RECENT_SIGNATURES);
 try{localStorage.setItem(RECENT_KEY,JSON.stringify(recentSignatures))}catch(e){}
}

/* ---------- Generation ---------- */

function nonzeroMag(){return randInt(2,9)}
function signedNum(sign){return sign*nonzeroMag()}

function makeQuestion(signs,ops,level,family){
 const nums=signs.map(s=>signedNum(s));
 const negativeCount=signs.filter(s=>s<0).length;
 const answerSign=negativeCount%2===0?1:-1;

 return {
  type:"signChain",nums,ops,signs,negativeCount,answerSign,level,family,
  prompt:level===1
   ?"علامت حاصل را قبل از محاسبه تعیین کن."
   :"منفی‌ها را دوتادوتا جفت کن؛ بعد علامت خروجی را تنظیم کن.",
  hint:negativeCount===0
   ?"هیچ عامل منفی‌ای در زنجیره نیست."
   :"هر دو علامت منفی در ضرب یا تقسیم، اثر علامتی یکدیگر را خنثی می‌کنند.",
  explanation:negativeCount===0
   ?"همه عددها مثبت‌اند، پس حاصل مثبت است."
   :negativeCount%2===0
   ? `${faNumber(negativeCount)} عدد منفی داریم. تعداد منفی‌ها زوج است؛ پس حاصل مثبت است.`
   : `${faNumber(negativeCount)} عدد منفی داریم. تعداد منفی‌ها فرد است؛ پس یک منفی بدون جفت می‌ماند و حاصل منفی است.`,
  signature:`${family}-${signs.join("_")}-${ops.join("_")}-${nums.map(Math.abs).join("_")}`
 };
}

function genPP(){return makeQuestion([1,1],["×"],1,"pp")}
function genPN(){return makeQuestion([1,-1],["×"],1,"pn")}
function genNN(){return makeQuestion([-1,-1],["×"],1,"nn")}
function genDivSame(){const s=pick([1,-1]);return makeQuestion([s,s],["÷"],1,"divsame")}
function genDivDifferent(){return Math.random()<.5?makeQuestion([-1,1],["÷"],1,"divdiff"):makeQuestion([1,-1],["÷"],1,"divdiff")}
function genTripleEven(){return makeQuestion(shuffle([-1,-1,1]),["×","×"],2,"tripleeven")}
function genTripleOdd(){return makeQuestion(shuffle([-1,-1,-1]),["×","×"],2,"tripleodd")}
function genFourOdd(){return makeQuestion(shuffle([-1,-1,-1,1]),["×","×","×"],2,"fourodd")}
function genFourEven(){return makeQuestion(shuffle([-1,-1,1,1]),["×","×","×"],3,"foureven")}
function genFive(){
 const negatives=pick([1,2,3,4,5]);
 const signs=[];
 for(let i=0;i<negatives;i++)signs.push(-1);
 while(signs.length<5)signs.push(1);
 return makeQuestion(shuffle(signs),["×","×","×","×"],3,"five");
}
function genMixedOps(){
 const negatives=pick([1,2,3,4]);
 const signs=[];
 for(let i=0;i<negatives;i++)signs.push(-1);
 while(signs.length<4)signs.push(1);
 return makeQuestion(shuffle(signs),shuffle(["×","×","÷"]),3,"mixedops");
}
function genLongEven(){return makeQuestion(shuffle([-1,-1,-1,-1,1]),["×","×","×","×"],3,"longeven")}
function genLongOdd(){return makeQuestion(shuffle([-1,-1,-1,1,1]),["×","×","×","×"],3,"longodd")}

const plan=[
 genPP,genPN,genNN,
 ()=>pick([genDivSame,genDivDifferent])(),
 genTripleEven,
 genTripleOdd,
 ()=>pick([genFourOdd,genFourEven])(),
 ()=>pick([genFive,genLongEven])(),
 genMixedOps,
 ()=>pick([genLongOdd,genFive,genMixedOps])()
];

function generateRound(){
 const result=[];
 for(const generator of plan){
  let q=null;
  for(let tries=0;tries<35;tries++){
   const candidate=generator();
   if(!recentSignatures.includes(candidate.signature)&&!result.some(x=>x.signature===candidate.signature)){
    q=candidate;break;
   }
  }
  if(!q){
   for(let tries=0;tries<15;tries++){
    const candidate=generator();
    if(!result.some(x=>x.signature===candidate.signature)){q=candidate;break}
   }
  }
  result.push(q||generator());
 }
 saveRecent(result);
 return result;
}

/* ---------- State ---------- */

function resetInteraction(){
 interactionState={
  outputSign:null,
  selectedNegative:null,
  pairedNegativeIndexes:[]
 };
}

function setLevel(level){
 const e=$("levelBadge");
 if(level===1){e.className="level";e.textContent="🟢 پایه"}
 else if(level===2){e.className="level master";e.textContent="🟡 تسلط"}
 else{e.className="level challenge";e.textContent="🔴 چالش"}
}

function expressionText(q){
 let text=`(${signed(q.nums[0])})`;
 for(let i=1;i<q.nums.length;i++){
  text+=` ${q.ops[i-1]} (${signed(q.nums[i])})`;
 }
 return text;
}

function renderQuestion(){
 stopTimer();
 answerChecked=false;
 resetInteraction();

 const q=questions[currentIndex];
 $("missionStatus").textContent=`${faNumber(currentIndex+1)} از ${faNumber(TOTAL_QUESTIONS)}`;
 $("scoreStatus").textContent=`${faNumber(score)} از ${faNumber(100)}`;
 setLevel(q.level);
 $("prompt").textContent=q.prompt;
 $("hint").textContent=q.hint;
 $("expression").textContent=expressionText(q);
 $("feedback").className="feedback";
 $("checkBtn").hidden=false;$("checkBtn").disabled=false;
 $("nextBtn").hidden=true;$("resetBtn").disabled=false;
 $("positiveBtn").disabled=false;$("negativeBtn").disabled=false;

 renderBelt();
 updateOutput();
 startTimer();
}

function renderBelt(){
 const q=questions[currentIndex],belt=$("belt");
 belt.innerHTML="";

 q.nums.forEach((num,index)=>{
  const b=document.createElement("button");
  b.type="button";
  b.className=`factor ${num<0?"negative":"positive"}`;
  b.textContent=signed(num);

  if(interactionState.pairedNegativeIndexes.includes(index))b.classList.add("paired");
  if(interactionState.selectedNegative===index)b.classList.add("selected");

  if(num<0 && q.level>=2){
   b.addEventListener("click",()=>negativeClicked(index));
  }else{
   b.disabled=true;
  }

  belt.appendChild(b);

  if(index<q.ops.length){
   const op=document.createElement("span");
   op.textContent=q.ops[index];
   op.style.cssText="font-weight:bold;color:#747b8e;font-size:18px";
   belt.appendChild(op);
  }
 });

 updatePairInfo();
}

function negativeClicked(index){
 if(answerChecked)return;
 if(interactionState.pairedNegativeIndexes.includes(index))return;

 if(interactionState.selectedNegative===null){
  interactionState.selectedNegative=index;
 }else if(interactionState.selectedNegative===index){
  interactionState.selectedNegative=null;
 }else{
  interactionState.pairedNegativeIndexes.push(interactionState.selectedNegative,index);
  interactionState.selectedNegative=null;
 }

 renderBelt();
}

function updatePairInfo(){
 const q=questions[currentIndex];
 const paired=interactionState.pairedNegativeIndexes.length;
 const unpaired=q.negativeCount-paired;

 if(q.level===1){
  $("pairInfo").textContent=q.negativeCount===0
   ?"همه ورودی‌ها مثبت‌اند."
   :`تعداد ورودی‌های منفی: ${faNumber(q.negativeCount)}`;
 }else{
  $("pairInfo").textContent=
   `منفی‌های جفت‌شده: ${faNumber(paired)} از ${faNumber(q.negativeCount)} | بدون جفت: ${faNumber(unpaired)}`;
 }

 $("negativeGear").className="gear "+(unpaired%2===0?"pos":"neg");
 $("negativeGear").textContent=unpaired%2===0?"+":"−";
}

function selectOutput(sign){
 if(answerChecked)return;
 interactionState.outputSign=sign;
 $("positiveBtn").classList.toggle("selected",sign===1);
 $("negativeBtn").classList.toggle("selected",sign===-1);
 updateOutput();
}

$("positiveBtn").addEventListener("click",()=>selectOutput(1));
$("negativeBtn").addEventListener("click",()=>selectOutput(-1));

function updateOutput(){
 const sign=interactionState.outputSign;
 const gear=$("outputGear");

 gear.className="gear";
 gear.textContent="؟";

 if(sign===1){gear.classList.add("pos");gear.textContent="+"}
 if(sign===-1){gear.classList.add("neg");gear.textContent="−"}
}

$("resetBtn").addEventListener("click",()=>{
 if(answerChecked)return;
 resetInteraction();
 $("positiveBtn").classList.remove("selected");
 $("negativeBtn").classList.remove("selected");
 $("feedback").className="feedback";
 renderBelt();updateOutput();
});

/* ---------- Evaluation ---------- */

function evaluate(q){
 if(interactionState.outputSign===null)return {ready:false,correct:false};

 if(q.level>=2){
  const expectedPaired=Math.floor(q.negativeCount/2)*2;
  if(interactionState.pairedNegativeIndexes.length!==expectedPaired){
   return {ready:false,correct:false,reason:"pairs"};
  }
 }

 return {ready:true,correct:interactionState.outputSign===q.answerSign};
}

function scoreForTime(ms){
 const s=ms/1000;
 if(s<=5)return 10;
 if(s<=10)return 8;
 if(s<=15)return 6;
 if(s<=20)return 4;
 if(s<=30)return 2;
 return 0;
}

function lockInteraction(){
 $("checkBtn").disabled=true;$("resetBtn").disabled=true;
 $("positiveBtn").disabled=true;$("negativeBtn").disabled=true;
 [...$("belt").querySelectorAll("button")].forEach(b=>b.disabled=true);
}

function feedback(kind,title,text){
 const f=$("feedback");f.className=`feedback show ${kind}`;f.innerHTML=`<strong>${title}</strong>${text}`;
}
function animate(cls){
 const e=$("gameCard");e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls);setTimeout(()=>e.classList.remove(cls),350);
}

function checkAnswer(){
 if(answerChecked||gameFinished)return;
 if(Date.now()>=questionDeadline){handleTimeout();return}

 const q=questions[currentIndex],r=evaluate(q);

 if(!r.ready){
  if(r.reason==="pairs"){
   feedback("timeout","موتور هنوز آماده نیست.","اول همه منفی‌هایی را که می‌توانند دوتادوتا جفت شوند، جفت کن.");
  }else{
   feedback("timeout","خروجی تنظیم نشده.","علامت مثبت یا منفی را برای خروجی موتور انتخاب کن.");
  }
  return;
 }

 answerChecked=true;stopTimer();lockInteraction();

 if(r.correct){
  const gained=scoreForTime(Date.now()-questionStartedAt);
  score=Math.min(100,score+gained);
  $("scoreStatus").textContent=`${faNumber(score)} از ${faNumber(100)}`;
  feedback("good",`✅ موتور درست کار کرد! +${faNumber(gained)} امتیاز`,q.explanation);
  animate("pop");
 }else{
  feedback("bad","❌ علامت خروجی اشتباه است.",`علامت صحیح ${q.answerSign===1?"مثبت":"منفی"} است. ${q.explanation}`);
  animate("shake");
 }

 $("checkBtn").hidden=true;$("nextBtn").hidden=false;
 $("nextBtn").textContent=currentIndex===TOTAL_QUESTIONS-1?"دیدن نتیجه 🏁":"مأموریت بعدی";
}
$("checkBtn").addEventListener("click",checkAnswer);

function handleTimeout(){
 if(answerChecked||gameFinished)return;
 answerChecked=true;stopTimer();lockInteraction();
 const q=questions[currentIndex];
 feedback("timeout","⏰ زمان تمام شد.",`خروجی باید ${q.answerSign===1?"مثبت":"منفی"} باشد. ${q.explanation}`);
 $("checkBtn").hidden=true;$("nextBtn").hidden=false;
 $("nextBtn").textContent=currentIndex===TOTAL_QUESTIONS-1?"دیدن نتیجه 🏁":"مأموریت بعدی";
}

/* ---------- Timer ---------- */

function startTimer(){
 stopTimer();questionStartedAt=Date.now();questionDeadline=questionStartedAt+QUESTION_TIME*1000;
 updateTimer();timerInterval=setInterval(updateTimer,100);
}
function updateTimer(){
 if(answerChecked||gameFinished)return;
 const remain=Math.max(0,questionDeadline-Date.now()),ratio=remain/(QUESTION_TIME*1000);
 $("timeText").textContent=`${faNumber(Math.ceil(remain/1000))} ثانیه`;
 $("timerFill").style.width=`${Math.max(0,Math.min(100,ratio*100))}%`;
 $("timerFill").style.background=ratio>.5?"#51dd91":ratio>.2?"#f5c543":"#e65362";
 if(remain<=0)handleTimeout();
}
function stopTimer(){if(timerInterval!==null){clearInterval(timerInterval);timerInterval=null}}

/* ---------- Flow ---------- */

$("nextBtn").addEventListener("click",()=>{
 if(!answerChecked||gameFinished)return;
 if(currentIndex===TOTAL_QUESTIONS-1){finishGame();return}
 currentIndex++;renderQuestion();
});

async function finishGame(){
 if(gameFinished)return;
 gameFinished=true;stopTimer();
 $("playArea").style.display="none";$("resultArea").classList.add("show");
 $("finalScore").textContent=faNumber(score);
 $("resultName").textContent=`${player.playerName||"بازیکن"}، امتیاز نهایی تو:`;
 $("resultMessage").textContent=
  score>=90?"عالی! بدون محاسبه طولانی، علامت زنجیره را از تعداد منفی‌ها تشخیص می‌دهی. 🌟":
  score>=70?"خیلی خوب! یادت بماند تعداد زوج منفی خروجی مثبت و تعداد فرد منفی خروجی منفی می‌دهد. ⚙️":
  score>=50?"قاعده دو علامت را می‌دانی؛ روی زنجیره‌های چندعاملی بیشتر تمرین کن. 🤖":
  "در دور بعد منفی‌ها را دوتادوتا جفت کن؛ اگر هیچ منفی بدون جفت نماند خروجی مثبت است، و اگر یکی بماند خروجی منفی.";

 if(!finishSubmitted){
  finishSubmitted=true;
  try{await GameSDK.finishGame(score)}catch(e){console.error("finishGame failed",e)}
 }
 await loadLeaderboard();
}

async function loadLeaderboard(){
 const box=$("leaderRows");
 box.innerHTML='<div style="text-align:center;color:#707890">در حال دریافت...</div>';
 try{
  const scores=await GameSDK.getLeaderboard(10);
  if(!scores||!scores.length){box.innerHTML='<div style="text-align:center;color:#707890">هنوز رکوردی ثبت نشده است.</div>';return}
  box.innerHTML="";
  scores.forEach((entry,i)=>{
   const row=document.createElement("div");row.className="leader-row";
   const rank=i===0?"🥇":i===1?"🥈":i===2?"🥉":`${faNumber(i+1)}.`;
   const a=document.createElement("span");a.textContent=`${rank} ${entry.playerName??entry.name??"بازیکن"}`;
   const b=document.createElement("strong");b.textContent=`${faNumber(entry.score??0)} امتیاز`;
   row.append(a,b);box.appendChild(row);
  });
 }catch(e){console.error("leaderboard failed",e);box.innerHTML='<div class="error">جدول برترین‌ها فعلاً قابل دریافت نیست.</div>'}
}

$("restartBtn").addEventListener("click",()=>{
 stopTimer();
 try{GameSDK.reset()}catch(e){console.error("reset failed",e)}
 score=0;currentIndex=0;answerChecked=false;gameFinished=false;finishSubmitted=false;interactionState={};
 $("scoreStatus").textContent="۰ از ۱۰۰";$("playArea").style.display="";$("resultArea").classList.remove("show");
 questions=generateRound();renderQuestion();
});

function init(){
 questions=generateRound();
 if(questions.length!==TOTAL_QUESTIONS)throw new Error("Exactly 10 missions are required.");
 renderQuestion();
}
init();
</script>
</body>
